<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bases y condiciones · VDH Club</title>
<meta name="description" content="Las bases y condiciones del VDH Club: cómo se suman los puntos, cómo se canjean los premios y qué se hace con tus datos.">
<meta name="theme-color" content="#F7F6F3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Las bases y condiciones del Club, en una página propia (SQL 73) ──
     Para pasar el enlace (Instagram, la Play Store, un reclamo) y leerlas
     sin la app. El texto NO está acá: lo escribe Mauricio en Configuración
     y viene de la base, el mismo que se ve adentro de la app.

     Clara siempre, como la cara de afuera del Club (index.html): la lee
     cualquiera, una vez, desde el celular. */
  :root {
    --bg:     #F7F6F3;
    --hoja:   #FFFFFF;
    --txt:    #1C1C1A;
    --txt-2:  #46433E;
    --txt-3:  #5A5750;
    --linea:  #E0DCD4;
    --sans:   'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--txt); font: 400 15px/1.55 var(--sans); }
  .pagina { max-width: 680px; margin: 0 auto;
            padding: calc(28px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
  .marca { display: inline-block; margin-bottom: 22px; font: 700 15px var(--sans); letter-spacing: .3px;
           color: var(--txt); text-decoration: none; }
  h1 { font: 700 clamp(26px, 7vw, 34px)/1.15 var(--sans); letter-spacing: -.5px; }
  .fecha { margin-top: 8px; font-size: 13.5px; color: var(--txt-3); min-height: 1.5em; }
  .texto { margin-top: 24px; background: var(--hoja); border: 1px solid var(--linea); border-radius: 8px; padding: 24px 22px; }
  .texto h3 { font: 700 16.5px/1.3 var(--sans); margin: 26px 0 8px; }
  .texto h3:first-child { margin-top: 0; }
  .texto p, .texto li { font-size: 15px; color: var(--txt-2); overflow-wrap: anywhere; }
  .texto p + p { margin-top: 8px; }
  .texto ul { padding-left: 20px; display: grid; gap: 6px; }
  .pie { margin-top: 22px; font-size: 14px; }
  .pie a { color: var(--txt); font-weight: 600; }
  @media (max-width: 420px) { .texto { padding: 18px 16px; } }
</style>
</head>
<body>
<main class="pagina">
  <a class="marca" href="index.html">VDH Club</a>
  <h1>Bases y condiciones</h1>
  <p class="fecha" id="fecha"></p>
  <div class="texto" id="texto"><p>Cargando…</p></div>
  <p class="pie"><a href="tarjeta.html">Ir a mi tarjeta</a></p>
</main>
<script src="club.js"></script>
<script>
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  /* El mismo formato que en la app y en Configuración: "## " es un título,
     "- " un punto de una lista y cada renglón un párrafo. */
  function basesHtml(texto) {
    var html = '', lista = false;
    String(texto || '').split(/\r?\n/).forEach(function (r) {
      var l = r.trim(), item = /^[-•]\s+/.test(l);
      if (lista && !item) { html += '</ul>'; lista = false; }
      if (!l) { return; }
      var t = esc(l.replace(/^(##\s+|[-•]\s+)/, '')).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
      if (/^##\s+/.test(l)) { html += '<h3>' + t + '</h3>'; }
      else if (item) { if (!lista) { html += '<ul>'; lista = true; } html += '<li>' + t + '</li>'; }
      else { html += '<p>' + t + '</p>'; }
    });
    return html + (lista ? '</ul>' : '');
  }
  /* "2026-10-10" → "10 de octubre de 2026", armada en hora local: una fecha
     sola la toma como medianoche UTC, que en Argentina es el día anterior. */
  function fechaLarga(iso) {
    var d = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
    if (!d) { return ''; }
    return new Date(+d[1], +d[2] - 1, +d[3]).toLocaleDateString('es-AR', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  var caja = document.getElementById('texto');
  club.texto('bases')
    .then(function (b) {
      if (!b || !b.texto) { caja.innerHTML = '<p>Todavía no están publicadas.</p>'; return; }
      caja.innerHTML = basesHtml(b.texto);
      if (b.actualizado) { document.getElementById('fecha').textContent = 'Actualizadas el ' + fechaLarga(b.actualizado) + '.'; }
    })
    .catch(function () {
      caja.innerHTML = '<p>No se pudieron cargar. Probá de nuevo en un rato.</p>';
    });
</script>
</body>
</html>
