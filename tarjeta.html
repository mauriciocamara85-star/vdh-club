  /**
   * "¡Pasaste a Oro!", durante una semana después de subir, o nada.
   *
   * Sale del movimiento del regalo (concepto 'bono_nivel'), no de comparar
   * niveles: así dice exactamente lo que le regalaron, y deja de aparecer
   * solo a los siete días.
   */
  function cartelNivel(t) {
    var m = null;
    (t.ultimas || []).forEach(function (x) {
      if (!m && x.concepto === 'bono_nivel') { m = x; }
    });
    if (!m || (Date.now() - new Date(m.cuando).getTime()) > 7 * 864e5) { return ''; }
    var nivel = String(m.obs || '').replace(/^Llegaste a /, '');
    var multi = Number(t.nivel && t.nivel.multiplica) || 1;
    var trofeo = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0Z"/>' +
      '<path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>';
    return '<div class="hoy-bonus">' + trofeo + '<div><b>¡Pasaste a ' + esc(nivel) + '!</b>' +
           '<span>Te regalamos ' + miles(m.puntos) + ' puntos' +
           (multi > 1 ? '. Ahora sumás ' + coma(multi) + ' puntos por cada $100.' : '.') +
           '</span></div></div>';
  }

  /**
   * El regalo de cumpleaños, o nada.
   *
   * Aparece desde 7 días antes del cumple hasta el día mismo, que es cuando
   * vale el regalo. El saludo cambia el día del cumple; el resto de la
   * semana es "se viene". Y el día del cumple dice que es el último día,
   * porque lo es.
   */
  function cartelCumple(t) {
    var c = t.cumple || {};
    if (!c.vale) { return ''; }
    var nombre = esc(String(t.nombre || '').split(' ')[0]);
    var titulo = c.es_hoy ? '¡Feliz cumple, ' + nombre + '!' : 'Se viene tu cumple, ' + nombre;
    var texto = c.usado
      ? 'Ya usaste tu regalo. ¡Que lo disfrutes!'
      : 'Tu regalo: ' + esc(c.texto) + '. Pedilo en la caja de cualquier local' +
        (c.es_hoy ? ', hoy es el último día.' : ' hasta el ' + fecha(c.hasta) + '.');
    var regalo = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/>' +
      '<path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>' +
      '<path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>';
    return '<div class="hoy-bonus">' + regalo + '<div><b>' + titulo + '</b>' +
           '<span>' + texto + '</span></div></div>';
  }

  /**
   * El cartel de "hoy suma más", o nada.
   *
   * Cuatro casos, y el saludo gana siempre: si hoy es su cumpleaños, el
   * título es "¡Feliz cumple!" aunque el doble venga por el Hot Sale. Lo que
   * suma y hasta cuándo va abajo, dicho con palabras: "el doble" se entiende
   * de un vistazo, "2x" hay que pensarlo.
   */
  function cartelHoy(t) {
    /* Sólo los puntos extra. El saludo de cumpleaños lo da cartelCumple(),
       que es donde está el regalo; acá se repetiría. */
    var hoy = t.hoy || {};
    var extra = Number(hoy.extra) || 1;
    if (extra <= 1) { return ''; }

    /* "1,5 veces más" se lee como 2,5: para los que no son redondos, el
       porcentaje de más. */
    var cuanto = extra === 2 ? 'el doble' : extra === 3 ? 'el triple'
               : 'un ' + Math.round((extra - 1) * 100) + '% más';
    var hastaCuando = hoy.hora_hasta ? ', hasta las ' + hoy.hora_hasta + ' h'
      : !hoy.hasta ? ''
      : hoy.hasta === hoyISO() ? ', solo por hoy'
      : ', hasta el ' + fecha(hoy.hasta);
    var nombre = esc(String(t.nombre || '').split(' ')[0]);

    var titulo, texto;
    if (hoy.cumple) {
      titulo = 'Es tu semana de cumple';
      texto = 'Tus compras suman ' + cuanto + hastaCuando + '.';
    } else {
      titulo = 'Tus compras suman ' + cuanto;
      texto = esc(hoy.motivo || 'Puntos extra') + hastaCuando + '.';
    }

    var icono = hoy.cumple
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/>' +
        '<path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>' +
        '<path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg>';

    return '<div class="hoy-bonus">' + icono + '<div><b>' + titulo + '</b>' +
           '<span>' + texto + '</span></div></div>';
  }

  /* Hoy como "2026-09-27", en la hora del teléfono. Es con lo que se compara
     el "hasta" que manda la base, que ya viene en días de Argentina. */
  function hoyISO() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
           ('0' + d.getDate()).slice(-2);
  }

  /* 12.300 y no 12300: los miles con punto, como se escriben acá. */
  function miles(n) { return Math.round(Number(n) || 0).toLocaleString('es-AR'); }

  /* 1,2 y no 1.2. */
  function coma(n) { return String(n).replace('.', ','); }

  function chipNivel(nombre) {
    var n = String(nombre || 'Plata');
    var clase = 'nv-' + n.toLowerCase().normalize('NFD').replace(/[^a-z]/g, '');
    var estrella = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
      '<path d="m12 2 3 6.6 7 .8-5.2 4.8 1.5 7L12 17.8 5.7 21.2l1.5-7L2 9.4l7-.8Z"/></svg>';
    return '<span class="chip-nivel ' + clase + '">' + estrella + esc(n) + '</span>';
  }

  function precargarPromo() {
    club.promos()
      .then(function (l) { promoCargada = l || []; })
      .catch(function () { /* sin promos, la tarjeta es la tarjeta */ });
  }

  /* ── "Tu tarjeta, siempre a mano" ──────────────────────────────────────
     Era una tarjeta larga en el medio de Mi tarjeta —título, dos párrafos y
     un botón— y estaba siempre, incluso para el que ya la había leído
     veinte veces. Ahora es un cartelito que cuelga arriba de la barra,
     aparece solo al entrar y se cierra para siempre con la X.

     Tres reglas que no se negocian:

       1. NO TAPA LA TARJETA. El cliente abrió esto para mostrar el código
          de barras en la caja, con la fila atrás. El cartel vive abajo, no
          tiene fondo que oscurezca nada y se cierra con un toque.

       2. NO PROMETE LO QUE EL NAVEGADOR NO DEJA HACER. Hay botón sólo
          donde hay instalación de verdad —el evento de Chrome— o donde el
          botón hace algo real —abrir en Chrome—. En iPhone no existe
          ninguna API para ofrecerlo: ahí se dice dónde tocar y nada más.

       3. NO INSISTE. Se muestra una vez; si lo cierra, no vuelve.
     ──────────────────────────────────────────────────────────────────── */
  var promptGuardado = null;

  /* ── El navegador de Samsung ──
     Samsung Internet no agrega un acceso directo: FABRICA UN APK y se lo pasa
     al instalador de Android. Ese APK apunta a una versión vieja de Android y
     Play Protect lo frena con un cartel que dice "Se bloqueó la app no
     segura", con nuestro ícono al lado.

     No hay nada acá que lo arregle: el APK lo genera Samsung y no elegimos a
     qué versión apunta. Y es un navegador que importa —viene de fábrica en
     los Samsung, que son muchos, y WhatsApp abre los enlaces con el navegador
     de fábrica—, así que el camino más probable desde el QR pasa por acá.

     Entonces no se ofrece instalar. Se ofrece abrirla en Chrome, donde se
     instala limpio. */
  function esSamsung() {
    return /SamsungBrowser\//.test(navigator.userAgent || '');
  }

  /* El enlace que abre ESTA misma página en Chrome. La dirección lleva el
     ?c= con el código —lo pone replaceState al arrancar—, y eso es lo que
     hace que la tarjeta aparezca del otro lado: lo guardado en un navegador
     no lo ve el otro, el código tiene que viajar en la dirección.

     browser_fallback_url es para el teléfono que no tenga Chrome: en vez de
     no hacer nada, recarga acá mismo. */
  function enChrome() {
    return 'intent://' + location.host + location.pathname + location.search +
           '#Intent;scheme=https;package=com.android.chrome;' +
           'S.browser_fallback_url=' + encodeURIComponent(location.href) + ';end';
  }

  window.addEventListener('beforeinstallprompt', function (e) {
    /* Sin esto Chrome muestra su propio cartelito abajo, que en un celular
       tapa justo el código de barras. */
    e.preventDefault();
    /* Samsung Internet también dispara este evento, y ahí el botón es
       justamente el que termina en el cartel de Play Protect. */
    if (!esSamsung()) { promptGuardado = e; }
    /* Puede llegar DESPUÉS de que el cartel ya esté a la vista con el
       camino a mano: se redibuja y el botón de verdad reemplaza al texto. */
    var c = $('instala');
    if (c && !c.hidden) { pintarInstalar(); }
  });

  window.addEventListener('appinstalled', function () {
    promptGuardado = null;
    cerrarInstalar(true);
    var f = $('filaInstalar');
    if (f) { f.hidden = true; }
  });

  /* Cerrado a mano. Una vez, y no vuelve. */
  var K_INSTALA = 'vdh_club_instalar_cerrado';
  function instalarCerrado() {
    try { return localStorage.getItem(K_INSTALA) === '1'; } catch (e) { return false; }
  }

  /* Sólo en teléfonos. En una computadora el cartel es ruido: nadie se
     guarda una tarjeta de fidelidad en el escritorio, y la tarjeta se abre
     ahí para mirarla —Mauricio mientras la armamos, un vendedor para
     mostrarla—, no para instalarla. */
  function esCelular() {
    try { return window.matchMedia('(hover: none) and (pointer: coarse)').matches; }
    catch (e) { return true; }
  }

  function esAndroid() { return /Android/.test(navigator.userAgent || ''); }

  /* Los navegadores DE OTRA APP: WhatsApp, Instagram, Facebook. En Android
     son un WebView —se identifica con "; wv)"— y un WebView no instala nada
     ni tiene menú donde buscarlo. Importa porque el camino más común del
     Club empieza justo ahí: el vendedor manda la tarjeta por WhatsApp. */
  function esOtraApp() {
    var ua = navigator.userAgent || '';
    return /;\s*wv\)/.test(ua) || /\bFBAN\b|\bFBAV\b|Instagram|Line\//.test(ua);
  }

  /**
   * Qué se le puede ofrecer a ESTE navegador. Cinco caminos y uno solo por
   * teléfono.
   *
   *   directo    Chrome o Edge avisaron que se puede instalar. Botón, y se
   *              instala en el acto.
   *   chrome     Samsung Internet o el navegador de otra app: no se puede
   *              instalar desde acá, pero abrirla en Chrome sí es una
   *              acción real y de un toque.
   *   safari     iPhone en Safari. No hay API: se dice dónde tocar.
   *   ios-otra   iPhone dentro de otra app. "Agregar a inicio" no existe
   *              ahí; primero hay que salir a Safari.
   *   menu       cualquier otro. Es el único que NO se muestra solo.
   */
  function modoInstalar() {
    /* El orden importa, y no es el evidente. Primero los teléfonos donde el
       botón NO PUEDE funcionar, y el evento después:

         · iPhone no tiene la API de instalar, en ninguna versión. Si algo
           dispara el evento ahí es un Chromium con la identificación de un
           iPhone —pasa, y pasó probando esto—, y un botón de instalar en un
           iPhone es una promesa que no se cumple.

         · Samsung Internet SÍ dispara el evento, y su instalación fabrica un
           APK que Play Protect frena con un cartel de "app no segura".

       Al revés, el evento ganaba y esos dos casos terminaban con un botón
       que no instala nada. */
    if (esIOS()) { return /Safari\//.test(navigator.userAgent || '') ? 'safari' : 'ios-otra'; }
    if (esSamsung()) { return 'chrome'; }
    if (promptGuardado) { return 'directo'; }
    /* El navegador de otra app va DESPUÉS del evento: WhatsApp en Android a
       veces abre en una pestaña de Chrome disfrazada, y ahí instalar se puede
       de verdad. */
    if (esAndroid() && esOtraApp()) { return 'chrome'; }
    return 'menu';
  }

  var instalaTimer;

  /**
   * Al entrar. Espera a que la tarjeta esté a la vista y recién entonces
   * aparece: primero lo que el cliente vino a buscar.
   *
   * La espera también le da tiempo al evento de Chrome, que no llega con la
   * página sino un rato después. Sin ella, el teléfono que SÍ puede
   * instalar vería un segundo las instrucciones del menú.
   */
  function ofrecerInstalar() {
    if (estaInstalada() || instalarCerrado() || !esCelular() || instalaTimer) { return; }
    instalaTimer = setTimeout(function () {
      if (estaInstalada() || instalarCerrado()) { return; }
      /* En Chrome de Android sin evento no se ofrece NADA. Las dos razones
         posibles son que ya esté instalada —Chrome deja de disparar el
         evento cuando lo está, y abierta en una pestaña display-mode no lo
         delata— o que el navegador no la considere instalable. En las dos,
         un cartel que manda a buscar en el menú molesta y no ayuda. El
         renglón de abajo de la tarjeta sigue estando para el que lo
         busque. */
      if (modoInstalar() === 'menu') { return; }
      abrirInstalar();
    }, 1800);
  }

  function abrirInstalar() {
    var c = $('instala');
    if (!c) { return; }
    /* La X se engancha acá y no al arrancar: es la salida del cartel y
       tiene que quedar atada en el mismo momento en que el cartel aparece,
       pase lo que pase con el resto. */
    var x = $('instalaX');
    if (x) { x.onclick = function () { cerrarInstalar(true); }; }
    pintarInstalar();
    c.hidden = false;
  }

  function cerrarInstalar(paraSiempre) {
    var c = $('instala');
    if (c) { c.hidden = true; }
    if (paraSiempre) {
      try { localStorage.setItem(K_INSTALA, '1'); } catch (e) {}
    }
  }

  function pintarInstalar() {
    var p = $('instalaP');
    var pie = $('instalaPie');
    if (!p || !pie) { return; }

    var modo = modoInstalar();

    /* Nada de "anda sin señal" acá. El service worker guarda la página y la
       tarjeta se acuerda de la última que vio, así que es probable que
       funcione — pero probable no se promete en un cartel: si algún día
       falla, el cliente queda parado en la caja creyendo lo que le dijimos.
       Se promete cuando esté probado de punta a punta. */
    p.innerHTML = 'Agregá VDH Club a la pantalla de inicio y abrila con un toque.' +
      (modo === 'chrome'
        ? (esSamsung()
            ? ' Desde este navegador Android muestra un aviso de seguridad, así que se agrega desde Chrome.'
            : ' La estás viendo dentro de otra app: se agrega desde Chrome.')
        : '');

    if (modo === 'directo') {
      pie.innerHTML = '<button type="button" class="btn" id="instalaYa">Instalar VDH Club</button>';
      $('instalaYa').onclick = instalarAhora;
      return;
    }

    if (modo === 'chrome') {
      pie.innerHTML = '<a class="btn" id="instalaChrome" href="' + esc(enChrome()) + '">Abrir en Chrome</a>';
      /* El que se va a Chrome no necesita volver a encontrar este cartel
         acá: del otro lado le va a aparecer el botón que instala de
         verdad. */
      $('instalaChrome').onclick = function () { cerrarInstalar(true); };
      return;
    }

    pie.innerHTML = '<p class="instala-paso">' + pasoAMano(modo) + '</p>';
  }

  function instalarAhora() {
    var p = promptGuardado;
    if (!p) { pintarInstalar(); return; }
    /* El evento se usa UNA vez. Se suelta antes de llamarlo para que un
       segundo toque no intente lo mismo con un evento gastado. */
    promptGuardado = null;
    p.prompt();
    /* Diga sí o diga no, el cartel se va. Repetirle el pedido a alguien que
       acaba de decir que no es la forma más rápida de que no vuelva a
       mirar; y si dijo sí, además llega appinstalled. */
    p.userChoice.then(function () { cerrarInstalar(true); })
                .catch(function () { cerrarInstalar(true); });
  }

  /* Los dos glifos que hacen la diferencia entre entender y no entender:
     el cliente no busca la palabra "Compartir", busca el dibujito. */
  function pasoAMano(modo) {
    var compartir = '<svg class="instala-glifo" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
      'stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M12 3v11"/><path d="m8 7 4-4 4 4"/>' +
      '<path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>';
    var menu = '<svg class="instala-glifo" viewBox="0 0 24 24" fill="currentColor" ' +
      'aria-hidden="true"><circle cx="12" cy="5" r="1.7"/>' +
      '<circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>';

    if (modo === 'safari') {
      return 'Tocá ' + compartir + ' abajo y después <b>Agregar a inicio</b>.';
    }
    if (modo === 'ios-otra') {
      /* El caso más común del Club y el peor de todos: el vendedor manda la
         tarjeta por WhatsApp, el cliente la toca ahí y queda en el
         navegador interno de WhatsApp, donde "Agregar a inicio" no existe.
         O sea que el que más la necesita es el que no puede. Y no hay
         ninguna API para sacarlo de ahí: lo único honesto es el camino. */
      return 'Tocá <b>Abrir en Safari</b> (abajo a la derecha) y ahí: ' +
             compartir + ' <b>Compartir</b> → <b>Agregar a inicio</b>.';
    }
    return 'Abrí el menú ' + menu + ' del navegador y tocá ' +
           '<b>Agregar a la pantalla principal</b>.';
  }

  /* El renglón del final de la tarjeta: el mismo camino, para el que cerró
     el cartel y después lo quiere. Un renglón, no una tarjeta — lo que se
     saca de en medio de la pantalla no puede volver por la ventana. */
  function filaInstalar() {
    return '<button type="button" class="fila-instalar" id="filaInstalar">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<rect x="5" y="2" width="14" height="20" rx="2.5"/>' +
      '<path d="M12 8.5v7M8.5 12h7"/></svg>' +
      'Agregar a la pantalla de inicio</button>';
  }

  function engancharFilaInstalar() {
    var f = $('filaInstalar');
    if (!f) { return; }
    f.onclick = function () {
      /* A mano se muestra siempre, aunque lo haya cerrado antes: lo pidió
         él. Y en una computadora también, por la misma razón. */
      abrirInstalar();
    };
  }

  /**
   * Este teléfono no tiene ningún código guardado.
   *
   * No es un error: la tarjeta no tiene usuario ni contraseña, la abre el
   * código y nada más. Así que puede pasar por tres razones —se anotó en
   * otro teléfono, el navegador borró los datos del sitio, o nunca se
   * anotó— y desde acá no hay forma de saber cuál es.
   *
   * Lo que NO se puede hacer es pedirle el teléfono y buscarla: el alta con
   * un número ya anotado tampoco devuelve la tarjeta, y por la misma razón.
   * Si alcanzara con tipear un número, esto sería un buscador de personas.
   * La recuperación pasa por el local, donde alguien con el PIN la abre.
   */
  function sinTarjeta() {
    var c = $('cargando');
    c.className = '';
    c.innerHTML =
      '<div class="caja">' +
        '<h2>Abrí tu tarjeta</h2>' +
        '<p class="vacio">Poné el WhatsApp con el que te anotaste y te la ' +
        'abrimos. Queda guardada en este teléfono: la próxima vez entra sola.</p>' +
        '<div class="campo" style="margin-top:16px">' +
          '<label for="recTel">Tu WhatsApp</label>' +
          '<input type="tel" id="recTel" inputmode="numeric" autocomplete="tel" ' +
                 'placeholder="11 2345 6789">' +
        '</div>' +
        '<button type="button" class="btn" id="recBtn">Abrir mi tarjeta</button>' +
        '<div class="msg mal" id="recMsg" hidden></div>' +
        '<p class="vacio" style="margin-top:18px">¿Todavía no sos socio? ' +
        '<a href="index.html">Anotate acá</a>, es gratis.</p>' +
      '</div>';

    $('recBtn').onclick = recuperar;
    $('recTel').onkeydown = function (e) { if (e.key === 'Enter') recuperar(); };
    $('recTel').focus();
  }

  /* Un solo dato y adentro. El teléfono es una credencial desde el
     24/09/2026: ver club.sql, arriba de club_recuperar, que es donde está
     escrito qué se ganó y qué se pagó con eso. */
  function recuperar() {
    var b = $('recBtn'), m = $('recMsg');
    m.hidden = true;
    b.disabled = true; b.textContent = 'Buscando…';

    club.recuperar($('recTel').value.trim())
      .then(function (t) {
        if (t && t.hay) {
          guardarCodigo(t.codigo);
          /* replace y no href: la vuelta atrás no tiene por qué pasar por
             la pantalla de "abrí tu tarjeta" una vez que ya está abierta. */
          location.replace('tarjeta.html?c=' + encodeURIComponent(t.codigo));
          return;
        }
        m.textContent = (t && t.porque) || 'No encontramos ninguna tarjeta con ese número.';
        m.hidden = false;
        b.disabled = false; b.textContent = 'Abrir mi tarjeta';
      })
      .catch(function (err) {
        m.textContent = (err && err.message) || 'No se pudo. Fijate la señal y probá de nuevo.';
        m.hidden = false;
        b.disabled = false; b.textContent = 'Abrir mi tarjeta';
      });
  }

  /* ═══ Dudas ══════════════════════════════════════════════════════════
     Las respuestas salen de las reglas que ya están implementadas, no de lo
     que estaría bueno que dijeran. Si alguna vez cambia una regla —la meta,
     los premios, el vencimiento— hay que cambiarla también acá, y por eso
     cada una dice de dónde sale.

     El WhatsApp es un enlace y nada más: no hay ninguna integración detrás,
     se abre la app del cliente con el mensaje empezado. */
  var WSP_CONSULTAS = '2235845942';

  var PREGUNTAS = [
    ['¿Cómo sumo puntos?',
     'Cada $100 que gastás es 1 punto. Mostrá tu tarjeta en la caja antes de ' +
     'pagar y el vendedor la escanea.'],
    /* club_reglas.pesos_por_punto = 100. Si cambia, cambia este texto. */

    ['¿Cómo me llevo un premio?',

    /* club_canjear_premio. El cliente no canjea desde el teléfono. */

    ['¿Sirve en todos los locales?',
     'Sí, en los 14. Podés sumar en uno y llevarte el premio en otro: la tarjeta ' +

    /* La tarjeta es compartida entre los 14 — ver club.sql. */

    ['¿Qué son Plata, Oro y Platino?',

    ['Perdí mi tarjeta, ¿qué hago?',
     'Abrí esta misma página y poné el WhatsApp con el que te anotaste: se abre ' +
     'sola. Y si no la encontrás, en cualquier local te la vuelven a abrir.'],
    /* club_recuperar. */

    ['¿Se la puedo prestar a alguien?',
     'La tarjeta es tuya y los puntos también. Quien tenga tu código puede ver tu ' +
     'tarjeta, así que mejor no lo compartas.']
    /* Honesto: el código ES la credencial, no hay nada que lo impida. */
  ];

  function bloqueAyuda() {

      '?text=' + encodeURIComponent('Hola! Tengo una consulta sobre el VDH Club.');

    var icono = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +

      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';

    /* Cerradas, como en la app de King: el renglón se toca y abajo aparecen
       las preguntas. El WhatsApp pasa a ser un renglón más y no un botón
       verde enorme: sigue estando, pero no grita. */
    return '<div class="caja ayuda">' +
      '<button type="button" class="ayuda-fila" id="btnDudas" aria-expanded="false" aria-controls="listaDudas">' +
        '<div><b>¿Te quedaron dudas?</b><span>Preguntas frecuentes</span></div>' + flecha +

  /* ═══ Las pestañas ═══════════════════════════════════════════════════
     Mostrar y esconder secciones, sin traer nada de la red: las tres vistas
     ya están en la página. Cambiar de pestaña tiene que ser instantáneo
     incluso sin señal — el cliente está parado en la caja.

     La pestaña viaja en el # de la dirección para que el botón de atrás del
     celular haga lo que se espera: volver a la tarjeta en vez de salirse de
     la app. Y la dirección SIN # sigue abriendo en la tarjeta, que es lo que
     usa el acceso directo de la pantalla de inicio. */
  function irA(nombre, conHistoria) {
    /* El mapa va ADENTRO y no en un var de afuera: irA() se llama al arrancar,
       antes de que la ejecución llegue a esta altura del archivo, y un var
       declarado más abajo todavía vale undefined. Eso tiraba el script entero
       en la primera línea y ni la tarjeta se dibujaba. Una declaración de
       función se iza; el valor de un var, no. */
    var VISTAS = { tarjeta: 'vTarjeta', promos: 'vPromos', locales: 'vLocales' };
    var v = VISTAS[nombre] ? nombre : 'tarjeta';

    Object.keys(VISTAS).forEach(function (k) {
      var s = $(VISTAS[k]);
      if (s) s.hidden = (k !== v);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.tab[data-vista]'), function (b) {
      if (b.dataset.vista === v) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });

    /* "Tarjeta de beneficios" es la bajada de la TARJETA, no de la app.
       En Promos y en Locales repetía algo que ya dice el título de la
       sección, y encima decía algo que no era: esa pantalla no es la
       tarjeta. Arriba queda sólo VDH Club. */
    var sub = $('cabSub');
    if (sub) sub.hidden = (v !== 'tarjeta');

    /* Arriba de todo al cambiar: entrar a Locales scrolleado a la mitad
       porque la tarjeta estaba scrolleada se lee como que se rompió. */
    window.scrollTo(0, 0);

    if (conHistoria) {
      try {
        history.pushState({ v: v }, '', v === 'tarjeta' ? location.pathname + location.search
                                                        : '#' + v);
      } catch (e) { /* en file:// tira excepción; las pestañas andan igual */ }
    }

    if (v === 'promos') pintarPromoGrande();
    if (v === 'locales') pintarLocales();
  }

  Array.prototype.forEach.call(document.querySelectorAll('.tab[data-vista]'), function (b) {
    b.onclick = function () {
      /* El botón rojo del medio, estando ya en la tarjeta, abre el código.
         Es el que el cliente va a tocar por reflejo parado en la caja. */
      if (b.dataset.vista === 'tarjeta' && $('vTarjeta') && !$('vTarjeta').hidden && socioCodigo) {
        abrirCodigo();
        return;
      }
      irA(b.dataset.vista, true);
    };
  });

  window.addEventListener('popstate', function (e) {
    /* "Atrás" con el código abierto lo cierra, en vez de salirse de la app
       o cambiar de pestaña por debajo. */
    var hoja = $('hojaCodigo');
    if (hoja && !hoja.hidden) { cerrarCodigo(true); return; }
    irA((e.state && e.state.v) || (location.hash || '').replace('#', '') || 'tarjeta', false);
  });

  /* ═══ El tema ═══════════════════════════════════════════════════════════ */
  function engancharTema() {
    var b = $('btnTema');
    if (!b) { return; }
    var SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/>' +
      '<path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    var LUNA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
    var pintarBoton = function () {
      var oscuro = document.documentElement.getAttribute('data-tema') !== 'light';
      b.innerHTML = oscuro ? SOL : LUNA;
      b.setAttribute('aria-label', oscuro ? 'Pasar a modo claro' : 'Pasar a modo oscuro');
    };
    b.onclick = function () {
      var nuevo = document.documentElement.getAttribute('data-tema') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-tema', nuevo);
      try { localStorage.setItem('vdh_club_tema', nuevo); } catch (e) {}
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) { m.setAttribute('content', nuevo === 'light' ? '#EDEEF0' : '#0A0B0D'); }
      pintarBoton();
    };
    pintarBoton();
  }

  /* ═══ El código, a pantalla completa ══════════════════════════════════ */

  /* El socio que está pintado. Lo pone pintar(). Va como var suelta y se
     lee sólo desde funciones que corren después de pintar(), así que el
     izado no la deja en undefined cuando importa. */
  var socioCodigo = null;
  var trabaPantalla = null;

  function abrirCodigo() {
    var hoja = $('hojaCodigo');
    var t = socioCodigo;
    if (!hoja || !t) { return; }
    $('hcNombre').textContent = t.nombre || '';
    $('hcNivel').innerHTML = chipNivel((t.nivel && t.nivel.nombre) || 'Plata');
    /* Se dibuja al abrir y no al cargar: si la tarjeta se actualizó por
       detrás, el código es el de ahora. */
    /* 150 de alto: una pistola que llega torcida lee mejor barras largas. */
    $('hcBarras').innerHTML = codigoDeBarras(t.codigo, 150);
    $('hcNumero').textContent = codigoBonito(t.codigo);
    hoja.hidden = false;

    /* Una entrada en el historial, así el "atrás" del celular la cierra. */
    try { history.pushState({ v: 'tarjeta', codigo: true }, '', location.pathname + location.search); }
    catch (e) { /* en file:// no hay historial; se cierra con la X */ }

    /* Que la pantalla no se apague mientras el vendedor escanea. No todos
       los navegadores lo permiten; si no, se apaga cuando se apagaría igual.
       El brillo no se puede subir desde una página: ninguno lo deja. */
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request('screen')
          .then(function (w) { trabaPantalla = w; })
          .catch(function () {});
      }
    } catch (e) {}
  }

  /* desdeAtras: la cerró el botón "atrás", que ya sacó su entrada del
     historial. Si la cerró la X, hay que sacarla a mano — si no, el próximo
     "atrás" no haría nada visible y parecería roto. */
  function cerrarCodigo(desdeAtras) {
    var hoja = $('hojaCodigo');
    if (!hoja || hoja.hidden) { return; }
    hoja.hidden = true;
    try { if (trabaPantalla) { trabaPantalla.release(); } } catch (e) {}
    trabaPantalla = null;
    if (!desdeAtras && history.state && history.state.codigo) {
      try { history.back(); } catch (e) {}
    }
  }

  /* Las salidas se enganchan una vez, al cargar, fuera de cualquier rama:
     la X, tocar el blanco fuera del código, y Escape en una computadora. */
  (function () {
    var hoja = $('hojaCodigo');
    if (!hoja) { return; }
    if ($('hcX')) { $('hcX').onclick = function () { cerrarCodigo(false); }; }
    hoja.onclick = function (ev) {
      if (ev.target === hoja) { cerrarCodigo(false); }
    };
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { cerrarCodigo(false); }
    });
  })();

  /* ── Promociones, a pantalla completa ──
     Sale de la misma función que el cartel de la tarjeta, así que la fecha
     de vencimiento la sigue decidiendo la base y no hay dos lugares donde
     arreglarla. */
  var promoCargada = null;

  var extrasCargados = [];

  /* "El doble", "1,5 veces": dicho con palabras. */
  function cuantoExtra(f) {
    f = Number(f);
    return f === 2 ? 'el doble' : f === 3 ? 'el triple' : 'un ' + Math.round((f - 1) * 100) + '% más';
  }

  function extrasHtml() {
    if (!extrasCargados.length) { return ''; }
    var rayo = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg>';
    return '<div class="extras"><div class="extras-tit">Puntos extra</div>' +
      extrasCargados.map(function (x) {
        return '<div class="extra' + (x.ahora ? ' ya' : '') + '">' + rayo +
          '<div><b>' + esc(x.nombre) + (x.ahora ? ' · ahora' : '') + '</b>' +
          '<span>Tus compras suman ' + cuantoExtra(x.factor) + ' de puntos ' + esc(x.cuando) + '</span></div>' +
        '</div>';
      }).join('') + '</div>';
  }

  /** Una promoción: la tarjeta grande y, si las tiene, sus condiciones. */
  function unaPromo(p) {
    /* La dirección de la foto va en una variable CSS y no pegada en el
       style: así el velo oscuro que hace legible el texto queda escrito UNA
       vez en la hoja de estilos, con su explicación al lado. Se escapan las
       comillas porque la escribe una persona. */
    var clase = 'promo-grande' + (p.imagen ? ' con-foto' : '');
    var estilo = p.imagen ? ' style="--foto:url(&quot;' + esc(p.imagen) + '&quot;)"' : '';

    /* Con enlace el cartel entero es un enlace; sin enlace sigue siendo un
       div. Se usa <a> y no un onclick para que funcione lo que la gente ya
       sabe hacer sin que nadie se lo explique: mantener apretado para abrir
       en otra pestaña, o copiar la dirección.

       rel="noopener" no es opcional: sin eso, la página que se abre puede
       manipular a la que la abrió. */
    var abre = p.enlace ? '<a class="promo-enlace" target="_blank" rel="noopener" href="' +
                          esc(p.enlace) + '">' : '<div>';
    var cierra = p.enlace ? '</a>' : '</div>';

    return abre +
      '<div class="' + clase + '"' + estilo + '>' + esc(p.texto) +
        (p.hasta ? '<span class="promo-hasta">Hasta el ' + fecha(p.hasta) + '</span>' : '') +
        (p.enlace ? '<span class="promo-ver">Ver más ' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
          'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="m9 18 6-6-6-6"/></svg></span>' : '') +
      '</div>' +
      cierra +
      /* Las condiciones quedan AFUERA del enlace: abrir un desplegable y que
         encima te lleve a otra página es lo contrario de lo que se quiso
         hacer. */
      (p.condiciones
        ? '<details class="promo-cond"><summary>Ver condiciones</summary><p>' +
          esc(p.condiciones) + '</p></details>'
        : '');
  }

  function pintarPromoGrande() {
    var caja = $('promoGrande');
    if (!caja) return;

    var irALaTarjeta = '<button type="button" class="btn promo-ir" id="promoVerTarjeta">' +
      'Ver mi tarjeta</button>';

    var pintar = function (lista) {
      caja.innerHTML = extrasHtml() +
        ((lista && lista.length)
          ? '<div class="promos-lista">' + lista.map(unaPromo).join('') + '</div>' +
            '<p class="vacio" style="margin-top:20px">Mostrá tu tarjeta en la caja de ' +
            'cualquier local para aprovechar' + (lista.length > 1 ? 'las' : 'la') + '.</p>'
          /* Con puntos extra arriba, "no hay promociones" se contradice con
             lo que el cliente acaba de leer: el cartel vacío no va. */
          : extrasCargados.length ? ''
          : '<div class="caja"><h2>No hay promociones activas</h2>' +
            '<p class="vacio">Cuando haya una, te la mostramos acá. Mientras tanto, tus ' +
            'compras siguen sumando puntos.</p></div>') +
        irALaTarjeta;

      if ($('promoVerTarjeta')) {
        $('promoVerTarjeta').onclick = function () { irA('tarjeta', true); };
      }
    };

    /* Los puntos extra se piden cada vez que se entra: una hora feliz
       empieza y termina en el día, y la lista de hace una hora puede estar
       vieja. Si fallan, las promociones se ven igual. */
    club.puntosExtra()
      .then(function (x) { extrasCargados = x || []; if (promoCargada) { pintar(promoCargada); } })
      .catch(function () {});

    if (promoCargada) { pintar(promoCargada); return; }
    caja.innerHTML = '<p class="vacio">Buscando…</p>';
    club.promos()
      .then(function (l) { promoCargada = l || []; pintar(promoCargada); })
      .catch(function () {
        caja.innerHTML = '<p class="vacio">No se pudo cargar. Fijate la señal y probá de nuevo.</p>';
      });
  }

  /* ── Los locales ──
     Salen de locales.js, que viaja con la página: catorce direcciones que
     cambian una vez por año no justifican un viaje a la base, y así la
     pantalla abre sin señal. */
  /* Dónde está el cliente, si lo dijo. Sólo en memoria: no hay ninguna
     razón para dejar anotado dónde estuvo alguien. */
  var miPosicion = null;

  function pintarLocales() {
    var caja = $('listaLocales');
    if (!caja) return;
    /* Se redibuja si llegó la ubicación; si no, una vez y listo. */
    if (caja.dataset.listo && !miPosicion) { engancharCerca(); return; }

    var pin = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>';
    var reloj = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
    var flecha = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

    /* Ordenados por cercanía si el cliente compartió dónde está; si no,
       como vienen, que es alfabético. */
    var lista = LOCALES_VDH.slice();
    if (miPosicion) {
      lista.forEach(function (l) {
        l._km = distanciaKm(miPosicion.lat, miPosicion.lng, l.lat, l.lng);
      });
      lista.sort(function (a, b) { return a._km - b._km; });
    }

    caja.innerHTML = lista.map(function (l) {
      /* La zona se esconde cuando repite el nombre: en Caseros decía
         "Caseros" abajo de "Caseros". En DOT dice "Shopping DOT · CABA" y
         ahí sí ubica al cliente, así que no se saca para todos. */
      var zona = (l.zona && l.zona !== l.nombre)
        ? '<div class="local-zona">' + esc(l.zona) + '</div>' : '';

      var dist = (miPosicion && l._km !== undefined)
        ? '<span class="local-dist">a ' + distanciaLinda(l._km) + '</span>' : '';

      return '<div class="local">' +
        '<b>' + esc(l.nombre) + dist + '</b>' + zona +
        '<div class="local-dato">' + pin + '<span>' + esc(l.dir) + '</span></div>' +
        '<div class="local-dato">' + reloj + '<span>' + esc(l.hora) + '</span></div>' +
        '<a class="local-ir" target="_blank" rel="noopener" href="' + esc(comoLlegar(l)) + '">' +
          'Cómo llegar' + flecha +
        '</a>' +
      '</div>';
    }).join('');
    caja.dataset.listo = '1';
    engancharCerca();
  }

  /* ── El más cercano ──
     Pide el permiso al tocar, y contesta SIEMPRE algo: si el cliente dice
     que no, o el teléfono no puede, el botón lo dice y la lista se queda
     como estaba. Un botón que no hace nada y no explica por qué es peor que
     no tener botón. */
  function engancharCerca() {
    var b = $('btnCerca');
    if (!b || b.dataset.listo) return;
    b.dataset.listo = '1';

    b.onclick = function () {
      if (!navigator.geolocation) {
        b.textContent = 'Tu teléfono no comparte la ubicación';
        b.disabled = true;
        return;
      }
      b.disabled = true;
      b.textContent = 'Buscando dónde estás…';

      navigator.geolocation.getCurrentPosition(
        function (pos) {
          miPosicion = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          pintarLocales();
          b.textContent = 'Ordenados por cercanía';
        },
        function () {
          b.disabled = false;
          b.textContent = 'No pudimos saber dónde estás';
        },
        /* Diez segundos y sin exigir el GPS fino: para elegir entre locales
           que están a kilómetros, la ubicación de la antena alcanza, y el
           GPS adentro de un shopping puede tardar una eternidad o no llegar
           nunca. */
        { timeout: 10000, maximumAge: 300000, enableHighAccuracy: false }
      );
    };
  }

  /**
   * El nombre de un local, escrito como se escribe.
   *
   * Sale de locales.js, que ya lo tiene bien: "Mar del Plata" y no "Mar Del
   * Plata", y "DOT" en mayúsculas. bonito() pone mayúscula después de cada
   * espacio sin distinguir, así que dejaba "Mar Del Plata" y "Villa Del
   * Parque", y a DOT lo convertía en "Dot". Queda de respaldo por si algún
   * día aparece un local que todavía no está en la lista.
   */
  function nombreLocal(codigo) {
    var c = String(codigo || '');
    for (var i = 0; i < LOCALES_VDH.length; i++) {
      if (LOCALES_VDH[i].codigo === c) return LOCALES_VDH[i].nombre;
    }
    return bonito(c);
  }

  /* Ya agregada a la pantalla de inicio: el cartel de cómo agregarla
     sobra, y es lo primero que mira alguien que ya lo hizo. */
  function estaInstalada() {
    try {
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
             navigator.standalone === true;
    } catch (e) { return false; }
  }

  /* El camino es distinto en cada teléfono y no hay forma de hacerlo por el
     cliente: en iOS no existe ninguna manera de que una página se ofrezca
     sola. Lo único que se puede es decir dónde tocar, y decirlo bien. */
  /* ═══ Los avisos ════════════════════════════════════════════════════════

     La campanita NO pide permiso sola. Nunca. El "no" del navegador es
     definitivo —no se puede volver a preguntar desde la página— y el que lo
     genera es el cartel que salta de sorpresa, cuando el cliente todavía no
     entendió qué es esto y aprieta "no" por reflejo.

     Tocando la campana, al permiso del sistema llega sólo el que ya decidió
     que sí. Se acepta casi siempre y no se pierde a nadie.
     ═══════════════════════════════════════════════════════════════════════ */

  /* La mitad pública del par de llaves. No es un secreto: identifica a VDH
     ante los servidores de Google y Apple, y sin ella el navegador no sabe
     a quién autorizar. La privada firma los envíos y vive en GitHub.

     Va como FUNCIÓN y no como var: alguien que abre la tarjeta sin tener
     una sale por sinTarjeta() antes de llegar acá, y un var izado vale
     undefined. Las funciones se izan enteras. */
  function vapid() {
    return 'BCG_mGNkME20VL9WrdVAUqSnPOPdNqQOIdyDGnY3UG8WbC-CbxV87N83mGVW71SZW_wrRYXMv2ZGkEWzRGLBxoo';
  }

  var suscripcion = null;

  /* El navegador quiere la llave en bytes, no en texto. Y en base64 "de la
     web": guiones en vez de + y /, y sin el relleno de iguales. */
  function aBytes(b64) {
    var s = (b64 + '===').slice(0, b64.length + (4 - b64.length % 4) % 4)
              .replace(/-/g, '+').replace(/_/g, '/');
    var crudo = atob(s);
    var u = new Uint8Array(crudo.length);
    for (var i = 0; i < crudo.length; i++) { u[i] = crudo.charCodeAt(i); }
    return u;
  }

  function hayPush() {
    return 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
  }

  function esIOS() {
    var ua = navigator.userAgent || '';
    return /iPad|iPhone|iPod/.test(ua) ||
           (ua.indexOf('Macintosh') > -1 && 'ontouchend' in document);
  }

  /* Cinco estados, y cada uno dice algo distinto. El que más importa es el
     de iPhone sin instalar: sin él, el cliente toca la campana, no pasa nada
     y se va pensando que está roto. */
  function estadoAvisos() {
    if (esIOS() && !estaInstalada()) { return 'ios'; }
    if (!hayPush()) { return 'no'; }
    if (Notification.permission === 'denied') { return 'bloqueado'; }
    return suscripcion ? 'si' : 'pedir';
  }

  function mirarAvisos() {
    /* Primero de todo: las salidas del cartel se enganchan pase lo que pase
       con el resto de esta funcion, que tiene varios returns. */
    engancharSalidas();

    var b = $('campana');
    if (!b) { return; }

    /* Un botón que no puede hacer nada no va: en un navegador viejo la
       campana se esconde y listo. El iPhone sin instalar SÍ la muestra,
       porque ahí hay algo que explicar. */
    if (!hayPush() && !esIOS()) { b.hidden = true; return; }
    b.hidden = false;
    b.onclick = abrirAvisos;

    if (!hayPush()) { pintarCampana(); return; }

    navigator.serviceWorker.ready
      .then(function (reg) { return reg.pushManager.getSubscription(); })
      .then(function (s) { suscripcion = s; pintarCampana(); })
      .catch(function () { pintarCampana(); });

    mirarSiHayNuevos();
  }

  function pintarCampana() {
    var b = $('campana');
    if (!b) { return; }
    var prendida = estadoAvisos() === 'si';
    b.classList.toggle('si', prendida);
    b.setAttribute('aria-label', 'Avisos');
    b.innerHTML =
      '<svg viewBox="0 0 24 24" fill="' + (prendida ? 'currentColor' : 'none') +
      '" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" ' +
      'stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>' +
      '<path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>' +
      (hayNuevos() ? '<span class="campana-punto"></span>' : '');
  }

  /* Abre y cierra el cartel. Lo que va adentro es asunto de pintarAvisos(),
     que también se llama sola cuando cambia el estado. */
  function abrirAvisos() {
    var tapa = $('avisosTapa');
    if (!tapa) { return; }
    if (!tapa.hidden) { cerrarAvisos(); return; }

    pintarAvisos();

    /* Si quedó vacío, algo falló. Se muestra igual —esconderlo dejaría una
       campana que no hace nada al tocarla, que es peor— pero con algo
       adentro y con su salida. */
    var caja = $('avisosCaja');
    if (caja && !caja.innerHTML.trim()) {
      caja.innerHTML =
        '<h2>Avisos</h2>' +
        '<p>No se pudo abrir esta pantalla. Cerrala y volvé a entrar a la tarjeta.</p>' +
        '<button type="button" class="btn-no" id="btnAvisosCerrar">Cerrar</button>';
      if ($('btnAvisosCerrar')) { $('btnAvisosCerrar').onclick = cerrarAvisos; }
    }

    tapa.hidden = false;
  }

  function cerrarAvisos() {
    var tapa = $('avisosTapa');
    if (tapa) { tapa.hidden = true; }
  }

  /* Las tres salidas del cartel —la X, el fondo y la tecla Escape— se
     enganchan UNA VEZ al cargar la página, fuera de cualquier rama que
     pueda no ejecutarse. Antes vivían adentro de mirarAvisos(), que sale
     temprano en varios casos; ahí la salida dependía de por dónde hubiera
     pasado el código, que es exactamente lo que no puede pasar. */
  function engancharSalidas() {
    var tapa = $('avisosTapa');
    if (!tapa) { return; }
    tapa.onclick = function (ev) { if (ev.target === tapa) { cerrarAvisos(); } };
    if ($('avisosX')) { $('avisosX').onclick = cerrarAvisos; }
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { cerrarAvisos(); }
    });
  }

  function pintarAvisos() {
    var caja = $('avisosCaja');
    if (!caja) { return; }

    /* Adentro de un try: lo que se arma acá consulta el estado del navegador
       —permisos, si está instalada, qué teléfono es— y cualquiera de esas
       puede portarse distinto en un navegador que no probamos. Que falle es
       aceptable; que falle EN SILENCIO y deje un cartel vacío tapando la
       pantalla, no. */
    try {
      pintarAvisosAdentro(caja);
    } catch (err) {
      caja.innerHTML =
        '<h2>Avisos</h2>' +
        '<p>No se pudo abrir esta pantalla en este teléfono.</p>' +
        '<button type="button" class="btn-no" id="btnAvisosCerrar">Cerrar</button>';
      if ($('btnAvisosCerrar')) { $('btnAvisosCerrar').onclick = cerrarAvisos; }
    }
  }

  function pintarAvisosAdentro(caja) {
    var e = estadoAvisos();

    var html =
      '<div class="buzon-cab">' +
        '<h2 id="avisosTit">Avisos</h2>' +
        (e === 'si' ? '<button type="button" class="buzon-apagar" id="btnAvisosNo">Desactivar</button>' : '') +
      '</div>';

    /* El permiso, cuando falta, es un RENGLÓN arriba de la lista — no la
       pantalla. El que ya los tiene prendidos no ve nada de esto: ve sus
       avisos y se va. */
    if (e === 'pedir') {
      html += '<div class="buzon-prender">' +
                '<p>Activalos y te enterás cuando entra ropa nueva o hay una ' +
                'promoción. Nunca más de un par por mes.</p>' +
                '<button type="button" class="btn" id="btnAvisosSi">Activar los avisos</button>' +
              '</div>';
    } else if (e === 'ios') {
      html += '<div class="buzon-prender">' +
                '<p>Para que te lleguen al teléfono, agregá la tarjeta a tu pantalla ' +
                'de inicio. Es la única forma que deja Apple.</p>' +
                '<p>' + comoAgregar() + '</p>' +
              '</div>';
    } else if (e === 'bloqueado') {
      html += '<div class="buzon-prender">' +
                '<p>Bloqueaste los avisos para este sitio y desde acá no se puede ' +
                'volver a pedir. Se cambia desde el navegador: tocá el candado al ' +
                'lado de la dirección → Notificaciones → Permitir.</p>' +
              '</div>';
    } else if (e === 'no') {
      html += '<div class="buzon-prender">' +
                '<p>Este navegador no puede recibir avisos al teléfono. Igual podés ' +
                'verlos acá cada vez que entres.</p>' +
              '</div>';
    }

    html += '<div class="buzon-lista" id="buzonLista">' +
              '<p class="buzon-vacio">Buscando…</p>' +
            '</div>';

    caja.innerHTML = html;
    if ($('btnAvisosSi')) { $('btnAvisosSi').onclick = activarAvisos; }
    if ($('btnAvisosNo')) { $('btnAvisosNo').onclick = desactivarAvisos; }

    traerAvisos();
  }

  /* Lo último que vimos, para el puntito de "hay algo nuevo". Guarda el id
     más alto: los ids crecen, así que alcanza con uno y no hay que guardar
     una lista. */
  var K_VISTO = 'vdh_club_avisos_visto';
  function ultimoVisto() {
    try { return Number(localStorage.getItem(K_VISTO) || 0); } catch (e) { return 0; }
  }
  function marcarVisto(id) {
    try { localStorage.setItem(K_VISTO, String(id)); } catch (e) {}
  }

  /* Cuándo llegó, en cómo lo diría una persona. Un "26/09/2026 10:53" en una
     lista de tres mensajes obliga a hacer la cuenta mentalmente. */
  function hace(iso) {
    var t = new Date(iso);
    if (isNaN(t)) { return ''; }
    var min = Math.round((Date.now() - t.getTime()) / 60000);
    if (min < 2)    { return 'recién'; }
    if (min < 60)   { return 'hace ' + min + ' minutos'; }
    var hs = Math.round(min / 60);
    if (hs < 24)    { return 'hace ' + hs + (hs === 1 ? ' hora' : ' horas'); }
    var dias = Math.round(hs / 24);
    if (dias === 1) { return 'ayer'; }
    if (dias < 7)   { return 'hace ' + dias + ' días'; }
    return t.toLocaleDateString('es-AR', { day: 'numeric', month: 'long' });
  }

  var avisosCargados = null;

  function traerAvisos() {
    var lista = $('buzonLista');
    if (!lista) { return; }

    /* Si ya se trajeron en esta visita se pintan de una: abrir y cerrar la
       campanita no tiene por qué volver a preguntarle a la base. */
    if (avisosCargados) { pintarLista(avisosCargados); return; }

    club.avisosVer()
      .then(function (r) {
        avisosCargados = Array.isArray(r) ? r : [];
        pintarLista(avisosCargados);
      })
      .catch(function () {
        var l = $('buzonLista');
        if (l) { l.innerHTML = '<p class="buzon-vacio">No se pudieron traer los avisos.</p>'; }
      });
  }

  function pintarLista(todos) {
    var lista = $('buzonLista');
    if (!lista) { return; }

    var fuera = borrados();
    var avisos = (todos || []).filter(function (a) { return fuera.indexOf(a.id) < 0; });

    if (!avisos.length) {
      /* Se distingue "nunca te mandamos nada" de "los borraste todos":
         decirle lo primero a alguien que acaba de borrar tres es decirle
         algo que él sabe que es falso. */
      lista.innerHTML = '<p class="buzon-vacio">' +
        ((todos && todos.length) ? 'Ya viste todos los avisos.'
                                 : 'Todavía no te mandamos ningún aviso.') + '</p>';
      return;
    }

    lista.innerHTML = avisos.map(function (a) {
      return '<div class="buzon-item" data-id="' + a.id + '">' +
               '<div class="buzon-borrar">' +
                 '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
                 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                 '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>' +
               '</div>' +
               '<div class="buzon-cara">' +
                 '<h3>' + esc(a.titulo || '') + '</h3>' +
                 '<p>' + esc(a.cuerpo || '') + '</p>' +
                 '<time>' + esc(hace(a.cuando)) + '</time>' +
               '</div>' +
             '</div>';
    }).join('');

    engancharDeslizar(lista);

    /* Abrirlo es haberlos visto. */
    marcarVisto(avisos[0].id);
    pintarCampana();
  }

  /* ── Deslizar para borrar ──
     Hacia la derecha, de a uno. El borrado es POR TELÉFONO: club_avisos es
     compartida —el mismo aviso le llegó a todos— así que borrarlo de verdad
     se lo sacaría a los demás socios. Acá se guardan los ids descartados en
     este celular y la lista los filtra.

     El umbral es un tercio del ancho y no unos pocos píxeles: un aviso
     borrado sin querer no se puede recuperar, y para deshacer haría falta
     un cartel que en una lista de tres mensajes molesta más de lo que
     salva. */
  function engancharDeslizar(lista) {
    Array.prototype.forEach.call(lista.querySelectorAll('.buzon-item'), function (item) {
      var cara = item.querySelector('.buzon-cara');
      if (!cara) { return; }

      var x0 = 0, y0 = 0, dx = 0, arrastrando = false, decidido = false;

      cara.addEventListener('touchstart', function (ev) {
        var t = ev.touches[0];
        x0 = t.clientX; y0 = t.clientY; dx = 0;
        arrastrando = true; decidido = false;
        cara.classList.remove('suelta');
      }, { passive: true });

      cara.addEventListener('touchmove', function (ev) {
        if (!arrastrando) { return; }
        var t = ev.touches[0];
        var mx = t.clientX - x0, my = t.clientY - y0;

        /* Hasta no saber si el gesto es horizontal o vertical no se toca
           nada: si se mueve la cara con cualquier roce, scrollear la lista
           se vuelve imposible. */
        if (!decidido) {
          if (Math.abs(mx) < 8 && Math.abs(my) < 8) { return; }
          if (Math.abs(my) > Math.abs(mx)) { arrastrando = false; return; }
          decidido = true;
        }

        /* Sólo hacia la derecha. Hacia la izquierda no arrastra: media
           interacción es peor que ninguna. */
        dx = Math.max(0, mx);
        cara.style.transform = 'translateX(' + dx + 'px)';
      }, { passive: true });

      function soltar() {
        if (!arrastrando) { return; }
        arrastrando = false;
        cara.classList.add('suelta');

        if (dx > cara.offsetWidth / 3) {
          borrarAviso(item);
        } else {
          cara.style.transform = '';
        }
        dx = 0;
      }

      cara.addEventListener('touchend', soltar, { passive: true });
      cara.addEventListener('touchcancel', soltar, { passive: true });
    });
  }

  function borrarAviso(item) {
    var id = Number(item.dataset.id);
    var cara = item.querySelector('.buzon-cara');

    /* Sale del todo hacia la derecha y después la fila se cierra sola. Las
       dos cosas por separado: si se colapsara la altura mientras todavía se
       está yendo, el aviso de abajo salta hacia arriba a mitad de camino. */
    if (cara) { cara.style.transform = 'translateX(110%)'; }

    setTimeout(function () {
      item.style.height = item.offsetHeight + 'px';
      item.classList.add('yendose');
      /* Un cuadro después: sin esto el navegador aplica el alto final junto
         con el inicial y no hay animación, sólo un salto. */
      requestAnimationFrame(function () {
        item.style.height = '0px';
        item.style.opacity = '0';
      });
      setTimeout(function () {
        marcarBorrado(id);
        avisosCargados = (avisosCargados || []).filter(function (a) { return a.id !== id; });
        pintarLista(avisosCargados);
        pintarCampana();
      }, 210);
    }, 200);
  }

  /* Los borrados de ESTE teléfono. */
  var K_BORRADOS = 'vdh_club_avisos_borrados';
  function borrados() {
    try { return JSON.parse(localStorage.getItem(K_BORRADOS) || '[]'); } catch (e) { return []; }
  }
  function marcarBorrado(id) {
    try {
      var b = borrados();
      if (b.indexOf(id) < 0) { b.push(id); }
      /* Se recorta: la lista del servidor son veinte, así que acordarse de
         más borrados es guardar basura para siempre. */
      localStorage.setItem(K_BORRADOS, JSON.stringify(b.slice(-60)));
    } catch (e) {}
  }

  /* El puntito de la campana: hay algo más nuevo que lo último que abrió.
     Se consulta al arrancar, una vez, junto con el resto. */
  function mirarSiHayNuevos() {
    club.avisosVer()
      .then(function (r) {
        avisosCargados = Array.isArray(r) ? r : [];
        pintarCampana();
      })
      .catch(function () { /* sin avisos, la campana se dibuja igual */ });
  }

  function hayNuevos() {
    if (!avisosCargados || !avisosCargados.length) { return false; }
    var fuera = borrados();
    var visto = ultimoVisto();
    /* Un aviso borrado no vuelve a encender el puntito: borrarlo ES haberlo
       visto. */
    return avisosCargados.some(function (a) {
      return a.id > visto && fuera.indexOf(a.id) < 0;
    });
  }

  function activarAvisos() {
    var btn = $('btnAvisosSi');
    if (btn) { btn.disabled = true; btn.textContent = 'Esperando…'; }

    /* requestPermission tiene que salir del toque del cliente. Acá lo está:
       este botón apareció porque él tocó la campana. */
    Notification.requestPermission().then(function (p) {
      if (p !== 'granted') {
        /* Dijo que no. No se insiste: el navegador ya no deja volver a
           preguntar desde acá, así que el cartel pasa a explicar cómo se
           revierte a mano. */
        pintarCampana();
        pintarAvisos();
        return;
      }

      return navigator.serviceWorker.ready.then(function (reg) {
        return reg.pushManager.subscribe({
          /* Obligatorio: promete que cada push va a mostrar algo. Un push
             silencioso serviría para rastrear gente, así que los navegadores
             no lo permiten. */
          userVisibleOnly: true,
          applicationServerKey: aBytes(vapid())
        });
      }).then(function (s) {
        suscripcion = s;
        var j = s.toJSON();
        return club.avisoAlta(s.endpoint, j.keys.p256dh, j.keys.auth, codigo);
      }).then(function () {
        pintarAvisos();
        pintarCampana();
      });
    }).catch(function () {
      var l = $('buzonLista');
      if (l) { l.innerHTML = '<p class="buzon-vacio">No se pudieron activar. Probá de nuevo en un rato.</p>'; }
      pintarCampana();
    });
  }

  function desactivarAvisos() {
    var s = suscripcion;
    if (!s) { return; }
    var btn = $('btnAvisosNo');
    if (btn) { btn.disabled = true; }

    /* Primero en el navegador y después en la base. Si el orden fuera al
       revés y fallara lo segundo, el cliente seguiría recibiendo avisos
       después de haberlos apagado, que es la peor forma de romper esto. */
    s.unsubscribe().then(function () {
      suscripcion = null;
      return club.avisoBaja(s.endpoint);
    }).catch(function () { /* la baja local ya ocurrió */ })
      .then(function () {
        pintarAvisos();
        pintarCampana();
      });
  }

  function comoAgregar() {
    var ua = navigator.userAgent || '';
    var ios = /iPad|iPhone|iPod/.test(ua) ||
              (ua.indexOf('Macintosh') > -1 && 'ontouchend' in document);

    if (!ios) return 'Abrí el menú del navegador y tocá <b>Agregar a la pantalla principal</b>.';

    /* En iPhone, "Agregar a inicio" existe SÓLO en Safari. Y el camino
       principal del Club termina justo al revés: el vendedor le manda la
       tarjeta por WhatsApp, el cliente la toca ahí, y se le abre en el
       navegador interno de WhatsApp, donde esa opción no está. O sea que el
       que más la necesita es el que no puede.

       La seña: los navegadores internos de iOS usan WKWebView y su
       identificación NO termina en "Safari/...". Safari de verdad sí. No es
       infalible, pero si se equivoca lo único que pasa es que el cliente lee
       un renglón de más. */
    var dentroDeOtraApp = !/Safari\//.test(ua);

    return dentroDeOtraApp
      ? 'Estás viéndola dentro de otra app. Tocá el botón de <b>abrir en Safari</b> ' +
        'y ahí sí: <b>Compartir</b> → <b>Agregar a inicio</b>.'
      : 'Tocá <b>Compartir</b> abajo y después <b>Agregar a inicio</b>.';
  }

  /* "23 de septiembre", como lo diría alguien. Sin el año: la tarjeta es de
     este año y ponerlo sólo hace la línea más larga. */
  function fecha(iso) {
    if (!iso) return '';
    try {
      /* Una fecha SOLA (2026-09-28, sin hora) la interpreta como medianoche
         UTC, y en Argentina eso es el día anterior a las 21:00. La promo que
         vencía el 28 mostraba "hasta el 27". Con año, mes y día sueltos el
         Date se arma en hora local y el día es el que dice el texto.
         Las marcas con hora —el "socio desde", que viene con zona— siguen
         por el camino de siempre. */
      var d = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
      var f = d ? new Date(+d[1], +d[2] - 1, +d[3]) : new Date(iso);
      return f.toLocaleDateString('es-AR', { day: 'numeric', month: 'long' });
    } catch (e) { return ''; }
  }
})();
</script>
