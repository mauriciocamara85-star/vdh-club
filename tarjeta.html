<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VDH Club</title>
<meta name="description" content="Tu tarjeta del Club VDH: mostrala en la caja.">
<meta name="theme-color" content="#0A0B0D">
<!-- El tema se decide ACÁ, antes de que el navegador pinte nada. Si se
     decidiera más abajo, quien eligió el oscuro vería un fogonazo blanco
     cada vez que abre la tarjeta.

     Oscuro por defecto y la elección queda guardada, como en las otras apps
     de VDH. No sigue al tema del teléfono: el oscuro es el de la marca. -->
<script>
  (function () {
    var t = 'dark';
    try { t = localStorage.getItem('vdh_club_tema') === 'light' ? 'light' : 'dark'; } catch (e) {}
    document.documentElement.setAttribute('data-tema', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) { m.setAttribute('content', t === 'light' ? '#EDEEF0' : '#0A0B0D'); }
  })();
</script>
<!-- Agregada a la pantalla de inicio, se abre sin la barra del navegador:
     es lo que hace que se sienta la tarjeta y no una página guardada.

     El manifest declara una start_url FIJA —tarjeta.html, sin código— y eso
     está bien desde que la tarjeta se recupera con el teléfono: el código
     lo pone el navegador, que se lo acuerda, y el día que lo pierda la app
     abre en "poné tu WhatsApp" y entra igual. Antes de eso un manifest
     habría instalado a todos apuntando a una página vacía, y por eso no
     estaba. -->
<link rel="manifest" href="tarjeta.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VDH Club">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* ── La tarjeta ──────────────────────────────────────────────────────────
     Esto lo abre alguien parado en la caja, con la fila atrás. Todo lo que
     hace falta tiene que verse SIN scrollear: el código de barras, el número
     y cuántas compras lleva. Lo demás va abajo. */
  :root {
    --bg:      #EDEEF0;
    --hoja:    #FFFFFF;
    --txt:     #16181B;
    --txt-2:   #4A4F55;
    --txt-3:   #55595F;
    --linea:   #DCDEE3;
    --acc:     #B51222;
    --acc-2:   #8E0E1B;
    --acc-soft:#FBEAEC;
    --ok:      #0F7444;
    --ok-soft: #E7F6EE;
    --r:       20px;
    --r-sm:    14px;
    --sans:    'DM Sans', system-ui, -apple-system, sans-serif;
    --display: 'Space Grotesk', var(--sans);

    /* El rojo como TEXTO va aparte del rojo de relleno. En claro son el
       mismo; en oscuro, el rojo de VDH sobre negro no se lee (2,6 a 1) y
       para letras hace falta uno más claro. Los botones rojos siguen con el
       de la marca. */
    --acc-txt:  #B51222;
    --pista:    #ECEDF0;
    --pista-2:  #2A2D31;
    --ok-borde: #A7D9BF;
    --ok-ico:   #CDEBDC;
    --mal-bg:   #FDF2F3;
    --mal-txt:  #A00F1E;
    --mal-borde:#F3CFD3;
    --carnet-borde: transparent;
  }

  /* ── El modo oscuro ──
     Medido contra la tarjeta, que es donde vive casi todo el texto: el más
     flojo (--txt-3) da 7,8 a 1, el rojo de texto 7,1, el verde 10,3. La
     tarjeta y el fondo se parecen (1,1 a 1) y lo que las separa es el
     borde, como en las otras apps.

     El código de barras NO cambia: su hoja sigue blanca. La pistola lee por
     contraste y negro sobre blanco es lo que mejor lee. */
  :root[data-tema="dark"] {
    color-scheme: dark;
    --bg:      #0A0B0D;
    --hoja:    #16181C;
    --txt:     #F3F4F6;
    --txt-2:   #C4C8CE;
    --txt-3:   #A7ACB4;
    --linea:   #2B2E34;
    --acc-txt: #FF7A84;
    --acc-soft: rgba(255, 122, 132, .14);
    --ok:      #4ADE93;
    --ok-soft: rgba(74, 222, 147, .12);
    --ok-borde: rgba(74, 222, 147, .45);
    --ok-ico:  rgba(74, 222, 147, .18);
    --pista:   #2A2D33;
    --pista-2: #E6E8EB;
    --mal-bg:  rgba(255, 138, 147, .10);
    --mal-txt: #FF8A93;
    --mal-borde: rgba(255, 138, 147, .40);
    --carnet-borde: rgba(255, 255, 255, .09);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--txt);
    font: 400 16px/1.55 var(--sans);
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 30px);
  }
  .hoja { width: 100%; max-width: 520px; margin: 0 auto; padding: 22px 20px 0; }

  .cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .cab b { font: 700 17px/1.1 var(--display); letter-spacing: -.3px; }
  .cab span { font-size: 12px; color: var(--txt-3); text-transform: uppercase; letter-spacing: .4px; }

  /* ── La campanita ──
     Blanco y negro, no roja. El rojo de VDH ya está en el carnet, en el
     botón de la barra y en los premios; una campana roja arriba a la derecha
     competía con todo eso por algo que es opcional.

     Apagada es un contorno sobre blanco: está disponible y no pide nada.
     Prendida se da vuelta —círculo negro, campana blanca llena— y ahí no
     hace falta ningún puntito de color para saber que está activa: el
     contraste lo dice solo, y de un vistazo.

     Ojo con los nombres de color acá: el Club tiene los SUYOS (--linea,
     --hoja, --acc) y no los del Sistema No Compra. Una variable que no
     existe no da error, descarta la propiedad en silencio. */
  .campana {
    position: relative;
    flex-shrink: 0;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border: 1.5px solid var(--linea);
    border-radius: 50%;
    background: var(--hoja);
    color: var(--txt);
    cursor: pointer;
    transition: background .18s ease, color .18s ease, border-color .18s ease;
  }
  /* Mismo caso que .tapa: display:grid y se esconde con hidden. Acá casi no
     se nota porque la campana casi siempre tiene que verse, pero en un
     navegador que no puede notificar tiene que desaparecer de verdad. */
  .campana[hidden] { display: none; }
  .campana:hover { border-color: var(--txt-3); }
  .cab-botones { display: flex; gap: 8px; align-items: center; }
  .campana svg { width: 20px; height: 20px; }

  .campana.si {
    background: var(--txt);
    border-color: var(--txt);
    color: var(--hoja);
  }

  /* ── El cartel de los avisos ──
     Centrado y con el fondo apagado: es la decisión más importante que toma
     el cliente en esta app —y la única que no se puede deshacer, porque el
     "no" del navegador es definitivo—. Un panel chico abajo del encabezado
     la trataba como un detalle. */
  /* El fondo es casi transparente: esto cuelga de la campanita, no tapa la
     pantalla. Sigue estando para poder cerrar tocando afuera, que es lo
     primero que prueba cualquiera. */
  .tapa {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(12, 13, 15, .22);
    padding: 0;
    animation: tapaEntra .2s ease-out;
  }
  /* ⚠ ESTA LÍNEA NO ES OPCIONAL, y su ausencia costó una noche.

     El atributo hidden del HTML esconde escribiendo display:none en la hoja
     del NAVEGADOR. El display:grid de acá arriba le gana —las reglas del
     autor pesan más— así que sin esto el hidden del marcado no hace nada y
     la capa queda tapando la pantalla entera desde que carga la página.

     Regla general para este archivo: todo lo que tenga un display propio y
     se esconda con hidden necesita su [hidden]. Ver .vista[hidden] abajo,
     que es el mismo caso y ya estaba resuelto. */
  .tapa[hidden] { display: none; }
  @keyframes tapaEntra { from { opacity: 0; } }

  /* Colgado de arriba a la derecha, debajo de la campanita. En un celular
     angosto se estira casi de lado a lado, que es lo que corresponde: una
     lista de mensajes necesita ancho para leerse. */
  .cartel {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 74px);
    right: 16px; left: 16px;
    max-width: 420px; margin-left: auto;
    max-height: 72dvh; overflow-y: auto;
    background: var(--hoja);
    border-radius: var(--r-sm);
    padding: 0;
    box-shadow: 0 18px 44px -14px rgba(12, 13, 15, .45);
    text-align: left;
    animation: cartelEntra .2s cubic-bezier(.2, .8, .3, 1);
  }
  @keyframes cartelEntra { from { opacity: 0; transform: translateY(-10px); } }

  .buzon-cab {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--linea);
  }
  .buzon-cab h2 { font: 700 16px var(--display); letter-spacing: -.2px; }
  .buzon-apagar {
    border: 0; background: none; padding: 4px 6px;
    margin-right: 30px;
    color: var(--txt-3); font: 600 12.5px var(--sans);
    text-decoration: underline; cursor: pointer;
  }
  .buzon-apagar:hover { color: var(--txt); }

  /* La franja de "activalos", arriba de la lista y sólo si están apagados.
     El permiso deja de ser la pantalla y pasa a ser un renglón. */
  .buzon-prender {
    padding: 14px 16px;
    background: var(--acc-soft);
    border-bottom: 1px solid var(--linea);
  }
  .buzon-prender p { font-size: 13.5px; line-height: 1.45; color: var(--txt-2); margin-bottom: 10px; }
  .buzon-prender .btn { margin-top: 0; min-height: 44px; line-height: 44px; font-size: 15px; }

  .buzon-lista { padding: 4px 0 8px; }
  /* Cada aviso son dos capas: el fondo rojo con el tacho, quieto, y la cara
     blanca que se corre con el dedo. Mover sólo la cara es lo que hace que
     el tacho "aparezca desde abajo" en vez de entrar empujando. */
  .buzon-item {
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--linea);
  }
  .buzon-item:last-child { border-bottom: 0; }

  .buzon-borrar {
    position: absolute; inset: 0;
    display: flex; align-items: center;
    padding-left: 22px;
    background: var(--acc);
    color: #fff;
  }
  .buzon-borrar svg { width: 21px; height: 21px; }

  .buzon-cara {
    position: relative;
    padding: 12px 16px;
    background: var(--hoja);
    /* touch-action deja que el navegador siga manejando el scroll vertical
       y nos cede el horizontal. Sin esto, arrastrar de costado también
       scrollea la lista y se pelean los dos gestos. */
    touch-action: pan-y;
  }
  .buzon-cara h3 { font: 700 14.5px/1.35 var(--sans); margin-bottom: 2px; }
  .buzon-cara p { font-size: 13.5px; line-height: 1.45; color: var(--txt-2); }
  .buzon-cara time { display: block; font-size: 11.5px; color: var(--txt-3); margin-top: 5px; }

  /* Sin transición mientras el dedo está apoyado: tiene que seguir la mano
     exacta. La transición se prende recién al soltar. */
  .buzon-cara.suelta { transition: transform .22s cubic-bezier(.2, .8, .3, 1); }
  .buzon-item.yendose { transition: height .2s ease, opacity .2s ease; overflow: hidden; }
  .buzon-vacio { padding: 26px 16px 30px; text-align: center; color: var(--txt-3); font-size: 13.5px; }

  /* El puntito de "hay algo nuevo". Se apaga al abrir el buzón. */
  .campana-punto {
    position: absolute; top: 1px; right: 1px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--acc);
    box-shadow: 0 0 0 2px var(--hoja);
  }

  .cartel-x {
    position: absolute; top: 9px; right: 10px;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: none; color: var(--txt-3);
    cursor: pointer;
  }
  .cartel-x svg { width: 18px; height: 18px; }
  .cartel-x:hover { background: var(--bg); color: var(--txt); }

  /* "Ahora no" va sin relleno y en gris: tiene que estar disponible y no
     tiene que competir. Esconderlo sería empujar, y el que se siente
     empujado dice que no — y ese no es para siempre. */
  .cartel .btn-no {
    display: block; width: 100%; margin-top: 10px;
    min-height: 48px;
    border: 1.5px solid var(--linea); border-radius: var(--r-sm);
    background: none; color: var(--txt-2);
    font: 600 15px var(--sans); text-align: center;
    cursor: pointer;
  }

  /* ── El carnet ──
     El material del tablero: grafito a negro y un resplandor rojo a la
     derecha. Llevaba además una textura de rayas diagonales; se fue el
     25/09/2026 junto con la de las tarjetas de números —Mauricio las vio y
     no le gustaron— y no hizo falta reemplazarla: el resplandor ya evita
     que el negro sea una tapa plana. Es lo único oscuro de la pantalla, así que
     es lo primero que se mira —que es exactamente lo que tiene que pasar—.
     El código de barras va sobre blanco adentro, porque un lector necesita
     negro sobre blanco y nada más. */
  .carnet {
    background:
      radial-gradient(70% 130% at 110% 42%, rgba(181, 18, 34, .55) 0%, rgba(181, 18, 34, .14) 46%, transparent 74%),
      linear-gradient(158deg, #2B2E33 0%, #141517 78%);
    border-radius: var(--r);
    padding: 16px;
    color: #fff;
    box-shadow: 0 16px 34px -18px rgba(22, 24, 27, .85);
    /* En oscuro el carnet se apoya sobre un fondo casi del mismo negro: el
       borde es lo que lo despega. En claro no hace falta. */
    border: 1px solid var(--carnet-borde);
  }
  .carnet-nom { font: 700 20px/1.2 var(--display); letter-spacing: -.4px; }
  .carnet-desde { font-size: 12px; opacity: .8; margin-top: 2px; }

  .barras {
    background: #fff;
    border-radius: var(--r-sm);
    padding: 11px 11px 8px;
    margin-top: 12px;
  }
  /* El número, grande y agrupado de a cuatro: es el respaldo para cuando el
     lector no llega a leer la pantalla, y hay que poder dictarlo sin
     equivocarse. */
  .numero {
    display: block; text-align: center;
    margin-top: 8px;
    font: 700 clamp(19px, 6vw, 25px)/1 var(--display);
    letter-spacing: 2px;
    color: #16181B;
    font-variant-numeric: tabular-nums;
  }
  .carnet-pie { font-size: 12.5px; opacity: .85; margin-top: 11px; text-align: center; }

  /* ── El botón del código ──
     Blanco sobre el carnet negro: es lo único que se toca en la caja y
     tiene que encontrarse sin buscarlo. Grande, al alcance del pulgar. */
  .carnet-botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .carnet-botones > :only-child { grid-column: 1 / -1; }
  /* El de los premios, de vidrio sobre el carnet: está, pero el blanco
     lleno queda para el código, que es el que se usa en la caja. */
  .btn-premios {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    min-height: 68px; border-radius: var(--r-sm);
    border: 1px solid rgba(255, 255, 255, .32); background: rgba(255, 255, 255, .08);
    color: #fff; font: 700 14.5px var(--sans); cursor: pointer;
  }
  .btn-premios svg { width: 22px; height: 22px; }
  .btn-codigo {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    width: 100%; min-height: 68px;
    border: 0; border-radius: var(--r-sm);
    background: #fff; color: #16181B;
    font: 700 14.5px var(--sans); cursor: pointer;
    box-shadow: 0 6px 18px -8px rgba(0, 0, 0, .6);
  }
  .btn-codigo svg { width: 22px; height: 22px; }

  /* ── El código, a pantalla completa ──
     BLANCO de lado a lado y no una tarjeta flotando sobre la pantalla: la
     pistola lee por contraste, y un código grande sobre blanco, sin nada
     alrededor, es lo más fácil de leer que se le puede poner adelante. Por
     encima de todo, barra y avisos incluidos. */
  .hoja-codigo {
    position: fixed; inset: 0; z-index: 100;
    background: #fff; color: #16181B;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px);
    text-align: center;
    animation: tapaEntra .18s ease-out;
  }
  /* ⚠ Igual que .tapa: el display de arriba le gana al hidden del HTML. Sin
     esta línea la hoja blanca tapa la tarjeta desde que carga la página. */
  .hoja-codigo[hidden] { display: none; }
  .hc-nombre { font: 700 22px/1.2 var(--display); letter-spacing: -.4px; }
  .hc-nivel { margin-top: 8px; }
  /* El código ocupa el ancho: más ancho = barras más gruesas = lee mejor. */
  .hc-barras { width: 100%; max-width: 560px; margin-top: 28px; }
  .hc-numero {
    display: block; margin-top: 12px;
    font: 700 clamp(24px, 7.5vw, 34px)/1 var(--display);
    letter-spacing: 2px; font-variant-numeric: tabular-nums;
  }
  .hc-pie { margin-top: 22px; font-size: 14.5px; color: var(--txt-2); }
  .hc-x {
    position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 12px;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--linea); background: #fff; color: #16181B;
    display: grid; place-items: center; cursor: pointer;
  }
  .hc-x svg { width: 20px; height: 20px; }

  /* ── El avance ── */
  .caja {
    background: var(--hoja);
    border: 1px solid var(--linea);
    border-radius: var(--r);
    padding: 20px;
    margin-top: 18px;
  }
  .caja h2 { font: 700 16px var(--display); letter-spacing: -.2px; }

  /* ── El saldo ──
     El número grande es lo segundo que busca el cliente, después del código
     de barras. Va en rojo y en la letra de títulos, como iba la cuenta de
     sellos. */
  .cuenta { display: flex; align-items: baseline; gap: 9px; margin-top: 4px; }
  .cuenta b {
    font: 700 clamp(38px, 12vw, 52px)/1 var(--display);
    color: var(--acc-txt); letter-spacing: -1.5px;
    font-variant-numeric: tabular-nums;
  }
  .cuenta span { font-size: 15px; color: var(--txt-2); }
  .falta { font: 600 16.5px/1.35 var(--sans); color: var(--txt); margin-top: 10px; }
  .falta b { color: var(--acc-txt); font-weight: 700; }
  .falta-sub { font-size: 14px; color: var(--txt-2); margin-top: 2px; line-height: 1.45; }
  .falta-sub b { color: var(--txt); }

  /* ── Hoy suma más ──
     Lleno y en rojo: es lo único de la tarjeta que VENCE. Los puntos dobles
     del Hot Sale se terminan el domingo, la semana del cumple también, y es
     la razón para venir esta semana y no la que viene. Va abajo del saldo y
     no arriba del carnet: el código de barras sigue siendo lo primero. */
  .hoy-bonus {
    display: flex; gap: 12px; align-items: center;
    margin-top: 14px; padding: 12px 14px;
    border-radius: var(--r-sm);
    background: linear-gradient(135deg, var(--acc), var(--acc-2));
    color: #fff;
  }
  .hoy-bonus svg { width: 24px; height: 24px; flex: none; }

  /* ── Los puntos extra, en Promos ──
     Arriba de las promociones: son lo que más rápido cambia (una hora
     feliz dura dos horas) y lo único que suma sin pedir nada. La que vale
     AHORA va en rojo lleno; las que vienen, en blanco con borde. */
  .extras { display: grid; gap: 10px; margin-bottom: 18px; }
  .extras-tit {
    font: 700 12px var(--sans); letter-spacing: .6px; text-transform: uppercase;
    color: var(--txt-3); margin-bottom: 2px;
  }
  .extra {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px; border-radius: var(--r-sm);
    background: var(--hoja); border: 1px solid var(--linea);
  }
  .extra svg { width: 22px; height: 22px; flex: none; color: var(--acc-txt); }
  .extra b { display: block; font: 700 15px/1.3 var(--sans); }
  .extra span { display: block; font-size: 13px; color: var(--txt-2); margin-top: 1px; }
  .extra.ya { background: linear-gradient(135deg, var(--acc), var(--acc-2)); border-color: transparent; color: #fff; }
  .extra.ya svg { color: #fff; }
  .extra.ya span { color: #fff; opacity: .92; }
  .hoy-bonus b { display: block; font: 700 15px/1.3 var(--sans); }
  .hoy-bonus span { display: block; font-size: 13px; line-height: 1.4; opacity: .94; margin-top: 2px; }

  .barra { height: 10px; border-radius: 999px; background: var(--pista); margin-top: 12px; overflow: hidden; }
  .barra i {
    display: block; height: 100%; border-radius: inherit;
    background: linear-gradient(90deg, var(--acc), var(--acc-2));
  }
  /* La del nivel es otra cosa y se tiene que ver distinta: fina y negra.
     Dos barras rojas iguales una abajo de la otra se leen como la misma. */
  .barra-fina { height: 6px; margin-top: 10px; }
  .barra-fina i { background: var(--pista-2); }

  /* ── El nivel ──
     Tres chapas que se distinguen sin leer: gris, dorada y negra. La negra
     es la de arriba de todo y es la misma idea que el ícono de la app.
     Van sobre el carnet (oscuro) y sobre la hoja (blanca), así que cada una
     tiene que leerse en los dos fondos. */
  .chip-nivel {
    flex: none; display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 10px; border-radius: 999px;
    font: 700 11px/1 var(--sans); letter-spacing: .6px; text-transform: uppercase;
  }
  .chip-nivel svg { width: 12px; height: 12px; }
  .nv-plata   { background: #DADDE2; color: #2A2D31; }
  .nv-oro     { background: #F1D27A; color: #3A2A00; }
  .nv-platino { background: #0B0C0E; color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .6); }

  .carnet-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }

  .nivel { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--linea); }
  .nivel-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .nivel-multi { font-size: 13px; color: var(--txt-2); font-weight: 600; text-align: right; }
  .nivel-txt { font-size: 14px; color: var(--txt-2); margin-top: 8px; line-height: 1.45; }
  .nivel-txt b { color: var(--txt); }
  /* ── El pedido de reseña ──
     Las cinco estrellas en el color de Google para que se reconozca de qué
     se trata sin leer; el resto, con los colores de siempre. */
  .resena-caja { text-align: center; }
  .resena-caja[hidden] { display: none; }
  .resena-estrellas { display: flex; justify-content: center; gap: 4px; color: #FBBC04; margin-bottom: 10px; }
  .resena-estrellas svg { width: 22px; height: 22px; }
  .resena-caja h2 { margin-bottom: 6px; }
  .resena-caja .btn { margin-top: 16px; }
  .resena-no {
    display: block; width: 100%; margin-top: 8px; padding: 10px;
    border: 0; background: none; cursor: pointer;
    font: 600 14px var(--sans); color: var(--txt-3);
  }

  /* ── La tarjeta del nivel ── */
  .nivel-top { display: flex; align-items: center; gap: 14px; }
  .trofeo {
    width: 54px; height: 54px; flex: none; border-radius: 16px;
    display: grid; place-items: center;
  }
  .trofeo svg { width: 28px; height: 28px; }
  /* Tres metales que se reconocen sin leer. Más específicos que las chapas
     .nv-* del carnet, que comparten el nombre. */
  .trofeo.nv-plata   { background: linear-gradient(145deg, #EEF0F3, #A9AFB8); color: #2A2D31; }
  .trofeo.nv-oro     { background: linear-gradient(145deg, #F8DE8E, #C6921A); color: #3A2A00; }
  .trofeo.nv-platino { background: linear-gradient(145deg, #34373E, #0B0C0E); color: #fff;
                       box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .5); }
  .nivel-rotulo { display: block; font: 700 11.5px var(--sans); letter-spacing: .7px; text-transform: uppercase; color: var(--txt-3); }
  .nivel-nom { display: block; font: 700 26px/1.1 var(--display); letter-spacing: -.5px; }
  .beneficios { list-style: none; margin-top: 14px; display: grid; gap: 8px; }
  .beneficios li { display: flex; align-items: center; gap: 10px; font-size: 14.5px; color: var(--txt-2); }
  .beneficios li b { color: var(--txt); }
  .beneficios svg { width: 18px; height: 18px; flex: none; color: var(--acc-txt); }
  .nivel-pie {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 16px;
    font: 600 13px var(--sans); color: var(--txt-2); font-variant-numeric: tabular-nums;
  }
  .nivel-pie span:last-child { white-space: nowrap; }
  .nivel-pie + .barra-fina { margin-top: 6px; }

  .nota { font-size: 12.5px; color: var(--txt-3); margin-top: 14px; }

  /* ── Los premios ──
     Sin botón de canjear, a propósito: el canje lo hace el vendedor desde la
     caja, que es donde se entrega la prenda. Un botón acá que no hace nada
     —o que "reserva" algo que después no está en el local— es peor que
     decir dónde se pide. */
  .caja-sub { font-size: 13.5px; color: var(--txt-3); margin-top: 2px; }
  .premios { margin-top: 14px; display: grid; gap: 10px; }
  /* En grilla: el nombre y el estado comparten el primer renglón, y lo que
     explica el premio va abajo a todo lo ancho. En fila, el estado de la
     derecha le comía el ancho al texto y "1.500 puntos · vale $12.000" se
     partía en tres renglones en un teléfono común. */
  .premio {
    display: grid; grid-template-columns: 40px 1fr auto;
    column-gap: 12px; row-gap: 2px; align-items: center;
    padding: 12px 13px;
    border: 1px solid var(--linea); border-radius: var(--r-sm);
  }
  .premio-ico {
    grid-row: 1 / span 2; align-self: start;
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--bg); color: var(--txt-3);
    display: grid; place-items: center;
  }
  .premio-ico svg { width: 20px; height: 20px; }
  .premio-nom { font-size: 15px; min-width: 0; }
  .premio-sub { grid-column: 2 / -1; font-size: 12.5px; color: var(--txt-3); line-height: 1.45; }
  .premio-est {
    display: flex; align-items: center; gap: 4px;
    font: 700 12.5px var(--sans); color: var(--txt-3); white-space: nowrap;
  }
  .premio-est svg { width: 13px; height: 13px; }
  .premio.listo { border-color: var(--ok-borde); background: var(--ok-soft); }
  .premio.listo .premio-ico { background: var(--ok-ico); color: var(--ok); }
  .premio.listo .premio-est { color: var(--ok); }
  /* Ya se lo llevó las veces que se puede por año. Apagado pero legible:
     tiene que entender por qué no se lo dan, no que desapareció. */
  .premio.agotado { opacity: .62; }

  /* ── Los movimientos ──
     Lo que entró y lo que salió, con el signo y en color: verde lo que suma,
     gris lo que resta. El gris y no el rojo para lo que resta, porque un
     canje no es una mala noticia — es el premio. */
  .mov {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--linea);
  }
  .mov:last-child { border-bottom: 0; }
  .mov b { display: block; font-size: 14px; font-weight: 600; }
  .mov span { display: block; font-size: 12.5px; color: var(--txt-3); }
  .mov em { flex: none; font: 700 15px var(--display); font-style: normal; font-variant-numeric: tabular-nums; }
  .mov em.mas { color: var(--ok); }
  .mov em.menos { color: var(--txt-3); }

  .lista { margin-top: 18px; }
  .fila { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--linea); font-size: 14px; }
  .fila:last-child { border-bottom: 0; }
  .fila span { color: var(--txt-3); }

  .vacio { font-size: 14.5px; color: var(--txt-2); line-height: 1.55; }
  .letra-chica { font-size: 12.5px; color: var(--txt-3); margin-top: 22px; text-align: center; line-height: 1.6; }
  .letra-chica a { color: var(--acc-txt); }
  .cargando { text-align: center; padding: 60px 0; color: var(--txt-3); }

  /* ── Las pestañas ──────────────────────────────────────────────────────
     La barra de abajo, al alcance del pulgar. Cuatro, y la del medio —la
     tarjeta— sobresale: es lo que el cliente viene a mostrar en la caja y lo
     que abre cuando entra.

     La app ARRANCA en la tarjeta, no en un menú. Hoy se abre y el código de
     barras está a la vista, y ésa es su mejor virtud: si al agregar pestañas
     quedara a un toque de distancia, habríamos empeorado. */
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }

  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    /* Esto es una app de CELULAR y sólo de celular (decisión de Mauricio,
       24/09/2026). Pero se abre igual en una computadora —él la mira ahí
       mientras la armamos— y una barra de 1900px de ancho con cuatro
       iconitos perdidos se ve rota. Se queda del ancho de la columna. */
    max-width: 520px; margin: 0 auto;
    /* Cinco, y por eso el boton del medio queda de verdad en el medio:
       con cuatro estaba en el lugar 3 de 4, apenas corrido. */
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--hoja);
    border-top: 1px solid var(--linea);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    border: 0; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 4px 10px;
    font: 600 11px var(--sans);
    color: var(--txt-3);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .tab svg { width: 22px; height: 22px; }
  .tab[aria-current="page"] { color: var(--acc-txt); }

  /* La del medio: un círculo rojo que sobresale de la barra. El margen
     negativo la levanta sin sacarla de la grilla, así las otras tres siguen
     repartidas parejo. */
  .tab-centro { position: relative; }
  .tab-centro .tab-ico {
    width: 52px; height: 52px; border-radius: 50%;
    margin-top: -22px; margin-bottom: 1px;
    background: linear-gradient(150deg, var(--acc), var(--acc-2));
    color: #fff;
    display: grid; place-items: center;
    box-shadow: 0 8px 20px -8px rgba(181, 18, 34, .75);
    border: 3px solid var(--bg);
  }
  .tab-centro svg { width: 25px; height: 25px; }

  /* ── "Tu tarjeta, siempre a mano" ──
     Un cartelito colgado arriba de la barra de pestañas. Los 88px de abajo
     no son un número al azar y están MEDIDOS en una pantalla de 390x844: la
     barra mide 68, el círculo rojo del medio le sobresale 12 y quedan 8 de
     aire. Si algún día cambia la barra, este número cambia con ella —y se
     vuelve a medir, que a ojo no se ve el pixel que falta. */
  .instala {
    position: fixed; z-index: 80;
    left: 12px; right: 12px;
    bottom: calc(env(safe-area-inset-bottom) + 88px);
    max-width: 496px; margin: 0 auto;
    display: grid; grid-template-columns: 46px 1fr; gap: 0 13px;
    background: var(--hoja);
    border: 1px solid var(--linea);
    border-radius: var(--r-sm);
    padding: 15px 16px 16px;
    box-shadow: 0 16px 40px -12px rgba(12, 13, 15, .45);
    animation: instalaEntra .3s cubic-bezier(.2, .8, .3, 1);
  }
  /* ⚠ Igual que .tapa: el display de arriba le gana al hidden del marcado.
     Sin esta línea el cartel queda a la vista, vacío, desde que carga. */
  .instala[hidden] { display: none; }
  @keyframes instalaEntra { from { opacity: 0; transform: translateY(14px); } }

  /* El ícono de la app, el mismo que va a quedar en la pantalla de inicio:
     que vea de antemano lo que le va a aparecer. */
  .instala-ico { width: 46px; height: 46px; border-radius: 11px; display: block; }
  /* Aire a la derecha para la X, que está encima. */
  .instala-txt { padding-right: 26px; }
  .instala-txt b { display: block; font: 700 15.5px/1.25 var(--display); letter-spacing: -.2px; }
  .instala-txt p { font-size: 13.5px; line-height: 1.45; color: var(--txt-2); margin-top: 4px; }
  .instala-pie { grid-column: 1 / -1; }
  .instala-pie .btn { margin-top: 13px; min-height: 46px; line-height: 46px; font-size: 15.5px; }
  .instala-paso {
    margin-top: 12px; padding: 11px 12px;
    background: var(--bg); border-radius: 11px;
    font-size: 13.5px; line-height: 1.65; color: var(--txt);
  }
  .instala-glifo { width: 16px; height: 16px; vertical-align: -3px; }
  .instala-x {
    position: absolute; top: 6px; right: 6px;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border: 0; background: none; border-radius: 50%;
    color: var(--txt-3); cursor: pointer;
  }
  .instala-x svg { width: 16px; height: 16px; }

  .fila-instalar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; margin-top: 18px; min-height: 48px;
    border: 1px solid var(--linea); border-radius: var(--r-sm);
    background: var(--hoja);
    font: 600 14.5px var(--sans); color: var(--txt-2);
    cursor: pointer;
  }
  .fila-instalar svg { width: 17px; height: 17px; }

  /* ── Las vistas ── */
  .vista[hidden] { display: none; }
  .vista h1 {
    font: 700 clamp(25px, 7vw, 32px)/1.15 var(--display);
    letter-spacing: -.8px; margin-bottom: 4px;
  }
  .vista-sub { font-size: 15px; color: var(--txt-2); margin-bottom: 20px; }

  /* ── Promos ──
     Pantalla entera para lo que Mauricio escribe en Configuración. Si no hay
     nada cargado, se dice — un cartel vacío es peor que ninguno. */
  /* Si es lo único que hay en la pantalla, que mande: más grande, más aire
     y más letra. Antes quedaba un cartelito arriba y media pantalla vacía. */
  .promo-grande {
    background:
      radial-gradient(70% 130% at 110% 20%, rgba(181, 18, 34, .55) 0%, rgba(181, 18, 34, .14) 46%, transparent 74%),
      linear-gradient(158deg, #2B2E33 0%, #141517 78%);
    background-size: cover;
    background-position: center;
    color: #fff;
    border-radius: var(--r);
    padding: clamp(34px, 9vw, 52px) clamp(24px, 6vw, 34px);
    min-height: 44vh;
    display: flex; flex-direction: column; justify-content: flex-end;
    font: 700 clamp(27px, 8vw, 38px)/1.2 var(--display);
    letter-spacing: -1px;
    box-shadow: 0 16px 34px -18px rgba(22, 24, 27, .85);
  }
  /* Que se note que lleva a algún lado. Una promo tocable que no lo
     parece es una promo que nadie toca. */
  .promo-enlace { display: block; text-decoration: none; color: inherit; }
  .promo-ver {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 10px;
    font: 700 13px var(--sans);
    color: #fff;
    opacity: .92;
  }
  .promo-ver svg { width: 15px; height: 15px; }

  .promo-hasta {
    display: block;
    font: 600 13px/1 var(--sans);
    letter-spacing: .5px; text-transform: uppercase;
    opacity: .75;
    margin-top: 18px;
  }
  /* La pantalla termina en algo que hacer. Contarle a alguien que hay un
     2x1 sirve si va al local y muestra la tarjeta; sin esto, la pantalla
     informa y lo deja ahí parado. */
  .promo-ir { margin-top: 18px; }

  /* Varias promos, una abajo de la otra, y GRANDES. Es pedido de Mauricio y
     se sostiene: con una foto cada una, scrollear se parece a mirar un feed
     de prendas y no a leer carteles. */
  .promos-lista { display: grid; gap: 22px; }

  /* Las condiciones —qué productos participan, si combina con otros
     descuentos, en qué locales vale— van en un <details> y no en otra
     pantalla: se leen una vez de cada diez y no justifican hacer navegar a
     nadie. Cerradas por defecto, para que no le ganen a la promo. */
  .promo-cond { margin-top: 10px; }
  .promo-cond summary {
    display: inline-flex; align-items: center; gap: 6px;
    font: 700 14px var(--sans);
    color: var(--acc-txt);
    cursor: pointer; list-style: none;
  }
  .promo-cond summary::-webkit-details-marker { display: none; }
  .promo-cond p {
    font-size: 14.5px; color: var(--txt-2); line-height: 1.55;
    margin-top: 9px;
    white-space: pre-line;
  }

  /* ── Con foto ──
     La foto va atrás de todo y encima un velo NEGRO DE ABAJO HACIA ARRIBA.
     Ese velo es lo que hace que esto funcione con cualquier imagen: el texto
     vive abajo (justify-content: flex-end), así que siempre cae sobre la
     parte más oscura. Sin el velo, una foto clara deja el texto blanco
     ilegible y no hay forma de saberlo de antemano — la foto la elige
     Mauricio y puede ser cualquiera.

     El resplandor rojo se va cuando hay foto: estaba para que un rectángulo
     negro no fuera una tapa plana, y con una imagen sobra.

     El 25/09/2026 el velo se levantó de arriba: antes cubría la foto ENTERA
     —incluso donde no hay texto— y apagaba la imagen sin necesidad. Ahora
     el tercio superior queda limpio y lo oscuro vive sólo debajo del texto.
     Menos de eso no se puede: el texto es blanco y la foto la elige
     Mauricio, así que puede ser una blanca. */
  .promo-grande.con-foto {
    background-image:
      linear-gradient(to top,
        rgba(10, 11, 12, .90) 0%,
        rgba(10, 11, 12, .70) 20%,
        rgba(10, 11, 12, .12) 50%,
        rgba(10, 11, 12, 0)   68%),
      var(--foto);
  }

  /* ── Locales ── */
  .local-mapa {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; margin-bottom: 18px;
    min-height: 52px;
    border-radius: var(--r-sm);
    background: linear-gradient(135deg, var(--acc), var(--acc-2));
    color: #fff;
    font: 700 16px var(--sans);
    text-decoration: none;
  }
  .local-mapa svg { width: 19px; height: 19px; }

  /* El botón de la ubicación. El permiso se pide CUANDO SE TOCA, no al
     abrir: pedirlo de entrada —como hace la app de la competencia, con un
     cartel antes de que hayas visto nada— es lo que hace que la gente
     apriete "Ahora no", y una vez que dicen que no, volver a pedirlo es un
     trámite. Tocado el botón, la respuesta casi siempre es que sí. */
  .local-cerca {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; margin-bottom: 18px;
    min-height: 48px;
    border: 1.5px solid var(--linea);
    border-radius: var(--r-sm);
    background: var(--hoja);
    color: var(--txt);
    font: 700 15px var(--sans);
    cursor: pointer;
  }
  .local-cerca svg { width: 18px; height: 18px; color: var(--acc-txt); }
  .local-cerca[disabled] { opacity: .6; }

  /* ── Dudas ──
     Las preguntas van en <details> nativos: cerradas ocupan un renglón cada
     una, así se ven las siete de un vistazo y el cliente abre la suya. Una
     lista de respuestas abiertas sería una pared de texto que no lee nadie.
     Y sin una línea de JavaScript. */
  .faq { border-top: 1px solid var(--linea); }
  .faq:first-of-type { border-top: 0; }
  .faq summary {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 13px 0;
    font: 600 15px/1.35 var(--sans);
    cursor: pointer; list-style: none;
  }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after {
    content: "+"; flex: none;
    font: 400 20px/1 var(--sans); color: var(--acc-txt);
  }
  .faq[open] summary::after { content: "–"; }
  .faq p {
    font-size: 14.5px; color: var(--txt-2); line-height: 1.55;
    padding-bottom: 14px;
  }

  /* ── La ayuda, como en la app de King ──
     Dos renglones y nada más: "¿Te quedaron dudas?" y "¿Necesitás ayuda?".
     Las siete preguntas abiertas de entrada eran una pared que empujaba la
     tarjeta hacia arriba; ahora están a un toque, para el que las busca. */
  .ayuda { padding: 6px 20px; }
  .ayuda-fila {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; padding: 14px 0;
    border: 0; background: none; text-align: left; cursor: pointer;
    color: var(--txt); text-decoration: none; font: inherit;
  }
  .ayuda-fila + .ayuda-fila, .ayuda-lista + .ayuda-fila { border-top: 1px solid var(--linea); }
  .ayuda-fila b { display: block; font: 700 16.5px/1.3 var(--display); letter-spacing: -.2px; }
  .ayuda-fila span { display: block; font-size: 14.5px; color: var(--txt-2); margin-top: 2px; }
  .ayuda-fila svg { width: 20px; height: 20px; flex: none; color: var(--txt-3); transition: transform .2s ease; }
  .ayuda-fila[aria-expanded="true"] svg { transform: rotate(90deg); }
  .ayuda-lista { padding-bottom: 6px; }
  /* ⚠ Por las dudas, como las otras capas del archivo: si algún día esto
     recibe un display, el hidden del marcado deja de esconderla. */
  .ayuda-lista[hidden] { display: none; }

  .btn-wsp {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; margin-top: 16px;
    min-height: 52px;
    border-radius: var(--r-sm);
    background: #25D366;
    /* Tinta oscura y no blanca: sobre ese verde, el blanco da 1,8:1. */
    color: #06331A;
    font: 700 16px var(--sans);
    text-decoration: none;
  }
  .btn-wsp svg { width: 20px; height: 20px; }

  .local-dist {
    display: inline-block;
    margin-left: 8px;
    background: var(--acc-soft); color: var(--acc-txt);
    border-radius: 999px; padding: 3px 9px;
    font: 700 12.5px var(--sans);
    vertical-align: middle;
  }

  .local {
    background: var(--hoja);
    border: 1px solid var(--linea);
    border-radius: var(--r-sm);
    padding: 16px 17px;
    margin-bottom: 11px;
  }
  .local b { display: block; font: 700 17px/1.2 var(--display); letter-spacing: -.3px; }
  .local-zona { font-size: 12.5px; color: var(--txt-3); margin-top: 2px; }
  .local-dato {
    display: flex; gap: 9px; align-items: flex-start;
    font-size: 14.5px; color: var(--txt-2); line-height: 1.45;
    margin-top: 11px;
  }
  .local-dato svg { width: 17px; height: 17px; flex: none; margin-top: 2px; color: var(--txt-3); }
  .local-ir {
    display: inline-flex; align-items: center; gap: 7px;
    margin-top: 14px;
    border: 1.5px solid var(--linea);
    border-radius: 999px;
    padding: 9px 16px;
    font: 700 14px var(--sans);
    color: var(--acc-txt);
    text-decoration: none;
  }
  .local-ir svg { width: 16px; height: 16px; }

  /* El mismo botón que la página de alta: esta pantalla no tenía ninguno
     porque hasta ahora no había nada que apretar. */
  /* Centrado con flex y no con line-height: el \`font:\` de abajo, por ser
     abreviado, devuelve el line-height a "normal". En un <button> no se
     notaba —el navegador lo centra solo— pero en un <a class="btn"> el
     texto quedaba pegado arriba ("Dejar mi reseña", "Anotarme en el
     Club"). */
  .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; margin-top: 20px;
    min-height: 54px;
    border: 0; border-radius: var(--r-sm);
    background: linear-gradient(135deg, var(--acc), var(--acc-2));
    color: #fff;
    font: 700 17px var(--sans); text-align: center; text-decoration: none;
  }
  .caja .vacio + .vacio { margin-top: 12px; }

  /* ── La promo ──
     Va pegada abajo del carnet y no arriba: el cliente abrió esto para ver
     su tarjeta, no para que le vendan algo. Pero va en rojo lleno, porque
     una vez que la tarjeta está a la vista esto es lo único nuevo de la
     pantalla. */
  /* Campos y aviso: hasta que la tarjeta se pudo recuperar con el teléfono,
     esta pantalla no tenía nada para completar. Mismos valores que la
     página de alta, incluidos los 16px de letra que evitan que iOS haga
     zoom solo al tocar el campo. */
  label { display: block; font-size: 14px; font-weight: 600; color: var(--txt-2); margin-bottom: 7px; }
  input[type=tel] {
    width: 100%;
    background: #fff;
    border: 1.5px solid var(--linea);
    border-radius: var(--r-sm);
    font: 500 16px var(--sans);
    color: var(--txt);
    padding: 14px 15px;
    outline: none;
  }
  input:focus { border-color: var(--acc-txt); box-shadow: 0 0 0 4px rgba(181, 18, 34, .14); }
  .msg { margin-top: 14px; font-size: 14.5px; line-height: 1.5; border-radius: var(--r-sm); padding: 13px 14px; }
  .msg.mal { background: var(--mal-bg); color: var(--mal-txt); border: 1px solid var(--mal-borde); }
</style>
</head>
<body>

<main class="hoja">
  <div class="cab">
    <div>
      <b>VDH Club</b><br>
      <span id="cabSub">Tarjeta de beneficios</span>
    </div>
    <!-- La campanita. Arranca oculta y sólo aparece si el navegador puede
         hacer notificaciones: un botón que no hace nada es peor que no
         tenerlo. -->
    <div class="cab-botones">
      <!-- Sol en oscuro (para pasar a claro), luna en claro. Mismo círculo
           que la campana, para que se lean como una familia. -->
      <button type="button" class="campana" id="btnTema" aria-label="Pasar a modo claro"></button>
      <button type="button" class="campana" id="campana" hidden
              aria-label="Avisos"></button>
    </div>
  </div>
  <!-- El cartel de los avisos. Se abre al tocar la campana y no antes.
       Vive fuera de .hoja para poder taparla entera. -->
  <div class="tapa" id="avisosTapa" hidden>
    <div class="cartel" role="dialog" aria-modal="true" aria-labelledby="avisosTit">
      <!-- La X va acá, en el HTML, y NO la dibuja el script. Es la salida
           del cartel, y la salida no puede depender de que el código que
           arma el contenido haya funcionado. Si algo falla adentro, esto
           sigue estando. -->
      <button type="button" class="cartel-x" id="avisosX" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div id="avisosCaja"></div>
    </div>
  </div>

  <section class="vista" id="vTarjeta">
    <div id="todo" hidden></div>
    <p class="cargando" id="cargando">Abriendo tu tarjeta…</p>
  </section>

  <section class="vista" id="vPromos" hidden>
    <h1>Promociones</h1>
    <p class="vista-sub">Lo que está vigente hoy en todos los locales.</p>
    <div id="promoGrande"></div>
  </section>

  <section class="vista" id="vLocales" hidden>
    <h1>Nuestros locales</h1>
    <p class="vista-sub">Encontrá tu local VDH. Mostrá tu tarjeta en cualquiera.</p>

    <!-- Ver los 14 juntos. Es lo único bueno que tenía el mapa de la
         competencia —saber cuál queda más cerca— y se resuelve abriendo la
         app de Maps, que además sabe dónde está el cliente y navega. Un mapa
         incrustado acá no podría hacer ninguna de las dos cosas, y encima
         pediría una clave de Google en un repositorio público.

         Es un "Mis Mapas" de Google (maps/d/viewer), que es lo que está
         hecho para compartir en público — antes era una lista guardada de la
         cuenta de Mauricio, que funcionaba pero dependía de un permiso suyo.
         Si algún día deja de andar, mirar primero que el mapa siga
         compartido, no el código. -->
    <a class="local-mapa" target="_blank" rel="noopener"
       href="https://www.google.com/maps/d/viewer?mid=1y8koZ_-YOh37JwyQhBwsMvZJ2EZJans">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4-6 2v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>
      Ver los 14 en el mapa
    </a>

    <button type="button" class="local-cerca" id="btnCerca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
      ¿Cuál me queda más cerca?
    </button>
    <div id="listaLocales"></div>
  </section>
</main>

<!-- ── El código, a pantalla completa ──
     Se abre con "Mostrar mi código" o con el botón rojo del medio de la
     barra. La X va en el marcado y no la dibuja el script: la salida de algo
     que tapa toda la pantalla no puede depender de que el resto funcione. -->
<div class="hoja-codigo" id="hojaCodigo" hidden role="dialog" aria-modal="true" aria-label="Tu código">
  <button type="button" class="hc-x" id="hcX" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="hc-nombre" id="hcNombre"></div>
  <div class="hc-nivel" id="hcNivel"></div>
  <div class="hc-barras" id="hcBarras"></div>
  <b class="hc-numero" id="hcNumero"></b>
  <p class="hc-pie">Mostralo en la caja antes de pagar</p>
</div>

<!-- ── "Tu tarjeta, siempre a mano" ──
     Cuelga arriba de la barra y NO tapa el carnet: lo que se ve al entrar
     sigue siendo la tarjeta. Arranca oculto; lo prende el script y sólo si
     corresponde. La X está acá, en el marcado, y no la dibuja el script:
     la salida de un cartel no puede depender de que el código que arma el
     contenido haya funcionado. -->
<div class="instala" id="instala" hidden>
  <button type="button" class="instala-x" id="instalaX" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <img class="instala-ico" src="icon-192.png" alt="" width="46" height="46">
  <div class="instala-txt">
    <b>Tu tarjeta, siempre a mano</b>
    <p id="instalaP"></p>
  </div>
  <div class="instala-pie" id="instalaPie"></div>
</div>

<!-- ── Las pestañas ──
     La tarjeta va al medio y sobresale: es lo que se usa parado en la caja.
     El e-shop es un enlace de verdad y no una pestaña con contenido, así que
     es un <a>: abre la tienda afuera. -->
<nav class="tabs" aria-label="Secciones">
  <button type="button" class="tab" data-vista="promos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2c0 .5.2 1 .6 1.4l8.8 8.8a2 2 0 0 0 2.8 0l7.2-7.2a2 2 0 0 0 0-2.8Z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>
    Promos
  </button>

  <button type="button" class="tab" data-vista="locales">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    Locales
  </button>

  <button type="button" class="tab tab-centro" data-vista="tarjeta">
    <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg></span>
    Mi tarjeta
  </button>

  <a class="tab" href="https://vdh.com.ar/" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    E-shop
  </a>

  <a class="tab" href="https://instagram.com/vdh.indumentaria" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5.5"/><circle cx="12" cy="12" r="4"/><path d="M17.6 6.4h.01"/></svg>
    Instagram
  </a>
</nav>

<script src="locales.js"></script>
<script src="codigo.js"></script>
<script src="club.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  /* El suyo, no el de la app de los vendedores: la tarjeta la lleva en el
     celular un cliente, y no tiene por qué compartir caché ni versiones con
     la herramienta de trabajo. Ver sw-club.js. */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw-club.js').catch(function () { /* anda igual */ });
    });
  }

  /* El código puede venir en la dirección —el enlace que el cliente se
     guardó o se pasó— o del celular, si se anotó acá. El de la dirección
     manda, y se guarda: así abrir el enlace en otro teléfono también
     funciona. */
  var m = /[?&]c=([0-9]+)/.exec(location.search);
  var codigo = m ? m[1] : codigoGuardado();
  if (m) guardarCodigo(m[1]);

  /* El botón del tema, antes que nada: tiene que andar también en la
     pantalla de "no encontramos tu tarjeta". */
  engancharTema();

  mirarAvisos();

  if (!codigo) { sinTarjeta(); return; }

  /* Sin recargar: la dirección pasa a llevar el código aunque haya venido
     del navegador. replaceState y no un salto, para no dejar la vuelta
     atrás llena de la misma página. */
  if (!m) {
    try {
      history.replaceState(null, '', 'tarjeta.html?c=' + encodeURIComponent(codigo));
    } catch (e) { /* en file:// tira excepción; la tarjeta anda igual */ }
  }

  /* Lo último que vimos de ESTA tarjeta. Se pinta si la base no contesta:
     en la caja de un shopping, con o sin señal, el código de barras tiene
     que estar. Los sellos pueden estar un día viejos y no pasa nada —el
     que suma es el vendedor, que sí tiene señal—. */
  var K_ULTIMA = 'vdh_club_ultima';

  function guardarUltima(t) {
    try { localStorage.setItem(K_ULTIMA, JSON.stringify({ codigo: t.codigo, t: t })); } catch (e) {}
  }
  function ultimaGuardada(cod) {
    try {
      var g = JSON.parse(localStorage.getItem(K_ULTIMA) || 'null');
      return (g && g.codigo === cod) ? g.t : null;
    } catch (e) { return null; }
  }

  irA((location.hash || '').replace('#', '') || 'tarjeta', false);

  club.tarjeta(codigo)
    .then(function (t) {
      if (!t || !t.hay) {
        var c = $('cargando');
        c.className = '';
        c.innerHTML =
          '<div class="caja">' +
            '<h2>No encontramos esa tarjeta</h2>' +
            '<p class="vacio">El código de ese enlace no corresponde a ' +
            'ninguna tarjeta. Si te la dieron en el local, fijate de haber ' +
            'copiado los doce números enteros.</p>' +
            '<a class="btn" href="index.html">Anotarme en el Club</a>' +
          '</div>';
        return;
      }
      guardarUltima(t);
      pintar(t);
    })
    .catch(function () {
      var vieja = ultimaGuardada(codigo);
      if (vieja) { pintar(vieja); sinSenal(); return; }
      $('cargando').textContent = 'No se pudo abrir. Fijate la señal y recargá.';
    });

  /* Se dice, no se esconde: el cliente tiene que saber que eso que está
     mirando puede no tener el sello de recién. */
  function sinSenal() {
    var a = document.createElement('p');
    a.className = 'letra-chica';
    a.style.marginTop = '14px';
    a.textContent = 'Sin señal: esto es lo último que vimos. El código de barras sirve igual.';
    $('todo').appendChild(a);
  }

  function pintar(t) {
    var puntos  = t.puntos || 0;
    var premios = t.premios || [];
    var nv      = t.nivel || { nombre: 'Plata', multiplica: 1 };
    var multi   = Number(nv.multiplica) || 1;

    /* Lo que le importa al cliente, en este orden: qué se puede llevar YA,
       y si no, cuánto le falta para lo más cercano. */
    var listos = premios.filter(function (p) { return p.alcanzado; });
    var proximo = null;
    /* El próximo es el primero que le FALTA, no el primero que no le dan: el
       que ya canjeó este año tampoco "le alcanza", y sin este filtro la
       tarjeta decía "con 0 puntos más llegás al accesorio". */
    premios.forEach(function (p) { if (!proximo && !p.alcanzado && !p.agotado) proximo = p; });

    var avance = proximo ? Math.min(100, Math.round(puntos * 100 / proximo.puntos)) : 100;

    var bonus = cartelNivel(t) + cartelCumple(t) + cartelHoy(t);

    /* Sin artículos delante del premio ("el perfume", "la remera"): el
       nombre lo escribe Mauricio en la base y el género no se sabe desde
       acá. "Te faltan 200 para tu próximo premio" y el nombre abajo se lee
       bien con cualquier premio que se cargue mañana. */
    var mensaje = '';
    if (listos.length) {
      var mejor = listos[listos.length - 1];
      mensaje = '<p class="falta">Ya podés llevarte <b>' + esc(mejor.nombre) + '</b></p>' +
        '<p class="falta-sub">Pedilo en cualquier local.' +
        (proximo ? ' Con ' + miles(proximo.falta) + ' puntos más llegás a <b>' +
                   esc(proximo.nombre) + '</b>.' : '') + '</p>';
    } else if (proximo) {
      mensaje = '<p class="falta">Te faltan <b>' + miles(proximo.falta) +
                '</b> para tu próximo premio</p>' +
                '<p class="falta-sub">' + esc(proximo.nombre) +
                (proximo.valor ? ' · vale $' + miles(proximo.valor) : '') + '</p>';
    }

    /* El nivel. Sin la palabra "XP": para el cliente son puntos, y lo que
       tiene que entender es que comprando más en el año sube. Canjear no lo
       baja — eso lo cuenta la pregunta de abajo, no hace falta acá. */
    /* La barra mide lo mismo que el número que tiene al lado: "4.400 de
       10.000" es 44 %. Antes medía el tramo entre Oro y Platino (400 de
       6.000, 7 %) y el cliente veía una barra casi vacía debajo de un
       número casi a la mitad. */
    var tramo = nv.hasta_xp
      ? Math.max(0, Math.min(100, Math.round((t.xp || 0) * 100 / nv.hasta_xp)))
      : 100;
    /* La tarjeta del nivel, como en la app de Fidelity: el trofeo, qué da
       este nivel y cuánto falta para el siguiente, con lo que da el
       siguiente. Antes era un renglón con la chapa y "1 punto por cada
       $100", y el cliente no tenía cómo saber qué ganaba subiendo. */
    var claseNv = 'nv-' + String(nv.nombre || 'Plata').toLowerCase().normalize('NFD').replace(/[^a-z]/g, '');
    var sigueMulti = Number(nv.sigue_multiplica) || 0;
    var trofeo = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0Z"/>' +
      '<path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>';
    var icoMas = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
      'stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
    var icoRegalo = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/>' +
      '<path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/></svg>';
    var siguiente = [];
    if (sigueMulti > 1) { siguiente.push(coma(sigueMulti) + ' puntos por cada $100'); }
    if (Number(nv.sigue_bono) > 0) { siguiente.push(miles(nv.sigue_bono) + ' de regalo al llegar'); }
    var nivelHtml =
      '<div class="caja nivel-caja">' +
        '<div class="nivel-top">' +
          '<div class="trofeo ' + claseNv + '">' + trofeo + '</div>' +
          '<div><small class="nivel-rotulo">Tu nivel</small><b class="nivel-nom">' + esc(nv.nombre) + '</b></div>' +
        '</div>' +
        '<ul class="beneficios">' +
          '<li>' + icoMas + '<span>' +
            (multi > 1 ? 'Sumás <b>' + coma(multi) + ' puntos</b> por cada $100' : '<b>1 punto</b> por cada $100') +
          '</span></li>' +
          (nv.regalo_cumple
            ? '<li>' + icoRegalo + '<span>En tu cumple: <b>' + esc(nv.regalo_cumple) + '</b></span></li>'
            : '') +
        '</ul>' +
        (nv.sigue
          /* Dos números en la misma pantalla ("501 puntos" arriba, "1 / 4.000"
             acá) y el cliente no sabía cuál era cuál. Los de arriba se
             gastan; estos son sólo de compras —los regalos no cuentan— y
             canjear no los baja. Cada uno con su nombre. */
          ? '<div class="nivel-pie"><span>Tus compras del último año</span>' +
              '<span>' + miles(t.xp) + ' de ' + miles(nv.hasta_xp) + '</span></div>' +
            '<div class="barra barra-fina"><i style="width:' + tramo + '%"></i></div>' +
            '<p class="nivel-txt">Te faltan <b>' + miles(nv.falta_xp) + '</b> puntos de compras para pasar a <b>' +
              esc(nv.sigue) + '</b>' + (siguiente.length ? ': ' + siguiente.join(' y ') : '') + '. ' +
              'Los regalos no cuentan para el nivel, y canjear no te lo baja.</p>'
          : '<p class="nivel-txt">Estás en el nivel más alto del Club.</p>') +
      '</div>';

    var candado = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
    var regalo = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/>' +
      '<path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>' +
      '<path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>';

    var catalogo = premios.map(function (p) {
      /* Tres estados y cada uno dice algo distinto: se lo pueden dar hoy,
         le faltan puntos, o ya se lo llevó las veces que se puede en el año.
         El tercero es el que evita que llegue al local y se lo nieguen. */
      var estado = p.agotado ? 'Ya lo canjeaste'
                 : p.alcanzado ? 'Te alcanza'
                 : candado + 'Faltan ' + miles(p.falta);
      return '<div class="premio' + (p.alcanzado ? ' listo' : '') +
                                   (p.agotado ? ' agotado' : '') + '">' +
        '<div class="premio-ico">' + regalo + '</div>' +
        '<b class="premio-nom">' + esc(p.nombre) + '</b>' +
        '<div class="premio-est">' + estado + '</div>' +
        '<div class="premio-sub">' + miles(p.puntos) + ' puntos' +
          (p.valor ? ' · vale $' + miles(p.valor) : '') +
          (p.detalle ? '<br>' + esc(p.detalle) : '') +
          /* El porqué va abajo, a todo lo ancho: a la derecha no entra. */
          (p.agotado ? '<br>Ya llegaste al límite de este año.' : '') +
        '</div>' +
      '</div>';
    }).join('');

    var movs = (t.ultimas || []).map(function (m) {
      var titulo;
      if (m.tipo === 'compra') { titulo = 'Compra en ' + nombreLocal(m.local); }
      else if (m.concepto === 'regalo_cumple') { titulo = 'Regalo de cumple: ' + (m.obs || ''); }
      else if (m.tipo === 'canje') { titulo = 'Te llevaste: ' + (m.obs || 'un premio'); }
      else if (m.concepto === 'bienvenida') { titulo = 'Regalo de bienvenida'; }

    var html =
      '<div class="carnet">' +
        '<div class="carnet-cab"><div>' +

        '<div class="carnet-botones">' +
          '<button type="button" class="btn-codigo" id="btnCodigo">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
            'stroke-linecap="round" aria-hidden="true"><path d="M4 5v14M7 5v14M10 5v14M14 5v14' +
            'M16 5v14M20 5v14"/></svg>Mostrar código</button>' +
          (premios.length
            ? '<button type="button" class="btn-premios" id="btnPremios">' + regalo + 'Ver premios</button>'
            : '') +
        '</div>' +
      '</div>' +

      '<div class="caja">' +

        '<div class="cuenta"><b>' + miles(puntos) + '</b><span>puntos</span></div>' +
        bonus +

        (t.compras

          : '<p class="vacio"' + (movs ? ' style="margin-top:14px"' : '') + '>Mostrá tu ' +
            'tarjeta la próxima vez que compres y empezás a sumar: cada $100 es un punto.</p>') +

      /* Un renglón, no una tarjeta. El aviso de instalar aparece solo al

      (estaInstalada() ? '' : filaInstalar()) +

    $('todo').innerHTML = html;

    if ($('cajaResena')) {

  /**
   * La promo se trae al abrir, pero NO se dibuja en la tarjeta.
   *
   * Tuvo dos formas antes de esta: un cartel rojo del tamaño de media
   * pantalla y después un renglón. Las dos estaban entre el código de
   * barras y el avance, o sea partiendo las dos cosas que son del cliente
   * para meter una comercial. Mauricio pidió sacarla del todo y tiene razón:
   * la promo ya tiene su pestaña, y el aviso de que hay algo nuevo va a ser

   *
   * El viaje se hace igual y en silencio: deja la promo cargada, así tocar
   * Promos es instantáneo. Si falla, la tarjeta ni se entera.
   */
  /**
   * "¿Qué tal tu compra en Flores?", durante los 7 días siguientes a una
   * compra en un local que tiene cargado su enlace de reseñas.
   *
   * Sin nada a cambio y el mismo texto para todos: son las dos reglas de

   * toca el botón, tampoco, porque ya fue.

  function cajaResena(t) {
    var r = t.resena;

    var clave = 'vdh_club_resena_' + r.local + '_' + String(r.cuando || '').slice(0, 10);
    try { if (localStorage.getItem(clave)) { return ''; } } catch (e) {}
    var estrella = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
      '<path d="m12 2 3 6.6 7 .8-5.2 4.8 1.5 7L12 17.8 5.7 21.2l1.5-7L2 9.4l7-.8Z"/></svg>';
    return '<div class="caja resena-caja" id="cajaResena" data-clave="' + esc(clave) + '">' +
      '<div class="resena-estrellas">' + estrella + estrella + estrella + estrella + estrella + '</div>' +
      '<h2>¿Qué tal tu compra en ' + esc(r.nombre) + '?</h2>' +
      '<p class="vacio">Contanos en Google cómo te atendieron. Nos ayuda a que más gente nos encuentre.</p>' +
      '<a class="btn" id="btnResena" target="_blank" rel="noopener" href="' + esc(r.url) + '">Dejar mi reseña</a>' +
      '<button type="button" class="resena-no" id="btnResenaNo">Ahora no</button>' +
